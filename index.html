<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Grammar Practice - 청담클루빌어학원</title>
    <style>
        :root {
            --primary-color: #1a56db;
            --primary-hover: #1e429f;
            --secondary-color: #047857;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --error-color: #dc2626;
            --success-color: #059669;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            word-break: keep-all;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 32px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }
        .academy-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .program-title {
            font-size: 28px;
            font-weight: 800;
            color: #111827;
            line-height: 1.3;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #374151;
        }
        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 86, 219, 0.15);
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .btn-secondary {
            background: #4b5563;
        }
        .btn-secondary:hover {
            background: #374151;
        }
        .btn-danger {
            background: var(--error-color);
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .hidden {
            display: none !important;
        }
        /* Concept Screen Styling */
        .concept-card {
            background: #f8fafc;
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .concept-point {
            font-size: 15px;
            margin-bottom: 12px;
            line-height: 1.7;
            background: #ffffff;
            padding: 14px 18px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        /* Quiz Styling */
        .quiz-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .quiz-question {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #111827;
            line-height: 1.5;
        }
        .option-btn {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 10px;
            background: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #e0e7ff;
            border-color: var(--primary-color);
        }
        .option-btn.selected {
            background: #dbeafe;
            border-color: var(--primary-color);
            font-weight: 700;
            color: var(--primary-color);
        }
        .progress-bar {
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s;
        }
        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            font-size: 14px;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        th {
            background: #f3f4f6;
            font-weight: 700;
        }
        /* Admin Nav Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="academy-title">청담클루빌어학원</div>
            <div class="program-title">Daily Grammar Practice</div>
        </div>

        <!-- Login Screen -->
        <div id="screen-login">
            <h3 style="text-align: center; margin-bottom: 20px;">로그인</h3>
            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="login-id" placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요">
            </div>
            <button class="btn" onclick="handleLogin()">로그인</button>
        </div>

        <!-- Student Concept View -->
        <div id="screen-student-concept" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 id="concept-header-title">문법 개념 학습</h2>
                <button class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 14px;" onclick="handleLogout()">로그아웃</button>
            </div>
            <div class="concept-card">
                <h3 id="concept-ch-title" style="margin-bottom: 16px; color: var(--primary-color);">Chapter 개념</h3>
                <div id="concept-points-list"></div>
            </div>
            <button class="btn" onclick="startQuiz()">퀴즈풀기</button>
        </div>

        <!-- Student Quiz View -->
        <div id="screen-student-quiz" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span id="quiz-progress-text" style="font-weight: 700; color: var(--primary-color);">문제 1 / 20</span>
                <span id="quiz-timer" style="color: var(--text-muted); font-size: 14px;"></span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="quiz-progress-fill"></div>
            </div>

            <div class="quiz-card">
                <div class="quiz-question" id="quiz-question-text">질문 텍스트</div>
                <div id="quiz-options-container"></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary" id="btn-prev-quiz" onclick="prevQuestion()" style="width: 30%;">이전</button>
                <button class="btn" id="btn-next-quiz" onclick="nextQuestion()" style="width: 70%;">다음</button>
            </div>
        </div>

        <!-- Student Quiz Result & Wrong Answer Review -->
        <div id="screen-student-result" class="hidden">
            <h2 style="text-align: center; margin-bottom: 10px;">퀴즈 결과</h2>
            <div style="text-align: center; margin-bottom: 24px; background: #f0fdf4; padding: 20px; border-radius: 12px; border: 1px solid #bbf7d0;">
                <div id="result-score" style="font-size: 36px; font-weight: 800; color: var(--success-color);">95점</div>
                <div id="result-status-msg" style="font-size: 16px; font-weight: 600; margin-top: 6px;">목표 점수를 달성했습니다!</div>
            </div>

            <h3 style="margin-bottom: 14px;">오답노트 및 자세한 해설</h3>
            <div id="review-list"></div>

            <button class="btn" onclick="returnToConcept()" style="margin-top: 20px;">개념학습으로 돌아가기</button>
        </div>

        <!-- Admin View -->
        <div id="screen-admin" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>관리자 대시보드</h2>
                <button class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 14px;" onclick="handleLogout()">로그아웃</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchAdminTab('tab-password')">비밀번호 변경</button>
                <button class="tab-btn" onclick="switchAdminTab('tab-accounts')">학생 계정 생성 및 관리</button>
                <button class="tab-btn" onclick="switchAdminTab('tab-learning')">학습 관리</button>
            </div>

            <!-- Tab 1: Password Change -->
            <div id="tab-password" class="admin-tab-content">
                <div class="form-group">
                    <label>새 비밀번호</label>
                    <input type="password" id="new-admin-pw">
                </div>
                <button class="btn" onclick="changeAdminPassword()">비밀번호 변경 저장</button>
            </div>

            <!-- Tab 2: Accounts -->
            <div id="tab-accounts" class="admin-tab-content hidden">
                <h4 style="margin-bottom: 12px;">학생 신규 등록 / 편집</h4>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group"><label>이름</label><input type="text" id="std-name"></div>
                    <div class="form-group"><label>학년</label><input type="text" id="std-grade" placeholder="예: 초4"></div>
                    <div class="form-group">
                        <label>성별</label>
                        <select id="std-gender">
                            <option value="남">남</option>
                            <option value="여">여</option>
                        </select>
                    </div>
                    <div class="form-group"><label>아이디</label><input type="text" id="std-id"></div>
                    <div class="form-group" style="grid-column: span 2;"><label>비밀번호</label><input type="text" id="std-pw"></div>
                </div>
                <button class="btn" onclick="saveStudentAccount()">학생 계정 저장</button>

                <h4 style="margin-top: 24px; margin-bottom: 12px;">등록된 학생 목록</h4>
                <table>
                    <thead>
                        <tr>
                            <th>이름</th><th>학년</th><th>성별</th><th>아이디</th><th>비밀번호</th><th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="student-list-tbody"></tbody>
                </table>
            </div>

            <!-- Tab 3: Learning Management -->
            <div id="tab-learning" class="admin-tab-content hidden">
                <h4 style="margin-bottom: 12px;">학생별 진도 및 목표 설정</h4>
                <table>
                    <thead>
                        <tr>
                            <th>아이디/이름</th>
                            <th>학습일자</th>
                            <th>학습 진도</th>
                            <th>퀴즈 범위</th>
                            <th>오답 내용</th>
                            <th>목표 점수</th>
                            <th>진도 할당</th>
                        </tr>
                    </thead>
                    <tbody id="learning-list-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

            const chKey = 'Ch.' + chNum;

            document.getElementById('concept-header-title').innerText = `${lvl} - Chapter ${chNum} 개념 학습`;
            const cData = (CONCEPTS_DB[lvl] && CONCEPTS_DB[lvl][chKey]) ? CONCEPTS_DB[lvl][chKey] : { title: `Chapter ${chNum}`, points: ['개념 내용 준비 중'] };

        // Start Quiz Logic (60% Current, 40% Previous)
        function startQuiz() {
            const lvl = currentUser.level || 'GRADE 1';
            const curCh = currentUser.chapter || 1;
            
            // Build current chapter pool
            const curPool = (QUIZZES_DB[lvl] && QUIZZES_DB[lvl]['Ch.' + curCh]) ? [...QUIZZES_DB[lvl]['Ch.' + curCh]] : [];
            
            // Build previous chapter pool
            let prevPool = [];
            for (let i = 1; i < curCh; i++) {
                if (QUIZZES_DB[lvl] && QUIZZES_DB[lvl]['Ch.' + i]) {
                    prevPool = prevPool.concat(QUIZZES_DB[lvl]['Ch.' + i]);
                }
            }

            let selectedQuizzes = [];
            
            if (prevPool.length === 0) {
                // First chapter: 100% from current pool
                selectedQuizzes = shuffleArray(curPool).slice(0, 20);
            } else {
                // 60% (12 items) from curPool, 40% (8 items) from prevPool
                const curSelected = shuffleArray(curPool).slice(0, 12);
                const prevSelected = shuffleArray(prevPool).slice(0, 8);
                selectedQuizzes = shuffleArray([...curSelected, ...prevSelected]).slice(0, 20);
            }

            // If questions are fewer than 20, duplicate pool gracefully
            while (selectedQuizzes.length < 20 && curPool.length > 0) {
                selectedQuizzes.push(curPool[Math.floor(Math.random() * curPool.length)]);
            }

            // Prepare questions with randomized options
            currentQuizList = selectedQuizzes.map(q => {
                let options = [];
                if (q.type === 'OX') {
                    options = [
                        { text: 'O', isCorrect: q.answer === 'O' },
                        { text: 'X', isCorrect: q.answer === 'X' }
                    ];
                } else {
                    const origOpts = [
                        { label: '1', text: q.opt1, isAns: q.answer === '1' },
                        { label: '2', text: q.opt2, isAns: q.answer === '2' },
                        { label: '3', text: q.opt3, isAns: q.answer === '3' },
                        { label: '4', text: q.opt4, isAns: q.answer === '4' }
                    ];
                    options = shuffleArray(origOpts);
                }
                return {
                    ...q,
                    shuffledOptions: options
                };
            });

            currentQuizIndex = 0;
            userAnswers = new Array(currentQuizList.length).fill(null);
            showScreen('screen-student-quiz');
            renderQuestion();
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

            document.getElementById('quiz-question-text').innerText = `[${q.type}] ${q.question}`;

            q.shuffledOptions.forEach((opt, idx) => {

            });

            document.getElementById('btn-prev-quiz').style.visibility = currentQuizIndex === 0 ? 'hidden' : 'visible';
            document.getElementById('btn-next-quiz').innerText = currentQuizIndex === currentQuizList.length - 1 ? '제출하기' : '다음';
        }

        function selectOption(optIdx) {
            userAnswers[currentQuizIndex] = optIdx;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuizIndex > 0) {
                currentQuizIndex--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuizIndex] === null) {
                alert('답안을 선택해주세요.');
                return;
            }
            if (currentQuizIndex < currentQuizList.length - 1) {
                currentQuizIndex++;
                renderQuestion();
            } else {
                submitQuiz();
            }
        }

        function submitQuiz() {
            let score = 0;
            const wrongHistory = [];

            currentQuizList.forEach((q, idx) => {
                const userChoice = userAnswers[idx];
                const selectedOpt = q.shuffledOptions[userChoice];
                let isCorrect = false;

                if (q.type === 'OX') {
                    isCorrect = selectedOpt.isCorrect;
                } else {
                    isCorrect = selectedOpt.isAns;
                }

                if (isCorrect) {
                    score += 5; // 20 questions = 100 pts max
                } else {
                    wrongHistory.push({
                        question: q.question,
                        userAns: selectedOpt ? selectedOpt.text : '미선택',
                        correctAns: q.answer,
                        exp: q.explanation
                    });
                }
            });

            const target = currentUser.targetScore || 90;
            const passed = score >= target;

            document.getElementById('result-score').innerText = `${score}점`;
            if (passed) {
                document.getElementById('result-status-msg').innerText = `축하합니다! 목표 점수(${target}점)를 달성하여 다음 Chapter로 진급합니다.`;
                currentUser.chapter = (currentUser.chapter || 1) + 1;
            } else {
                document.getElementById('result-status-msg').innerText = `목표 점수(${target}점)에 미달하였습니다. 개념을 다시 복습해보세요.`;
            }

            currentUser.lastDate = new Date().toISOString().split('T')[0];
            currentUser.wrongHistory = wrongHistory;
            saveStudents();

            // Render Wrong Answers Review
            const reviewList = document.getElementById('review-list');
            if (wrongHistory.length === 0) {
                reviewList.innerHTML = '<div style="padding: 16px; background: #f0fdf4; border-radius: 8px;">틀린 문제 없이 완벽하게 맞았습니다!</div>';
            } else {
                reviewList.innerHTML = wrongHistory.map(w => `
                    <div style="margin-bottom: 16px; padding: 16px; border: 1px solid #fca5a5; background: #fff5f5; border-radius: 8px;">
                        <div style="font-weight: 700; color: #991b1b; margin-bottom: 6px;">[오답] ${w.question}</div>
                        <div style="font-size: 14px; color: #7f1d1d;">선택한 답: ${w.userAns}</div>
                        <div style="font-size: 14px; font-weight: 700; color: #065f46;">정답: ${w.correctAns}</div>
                        <div style="font-size: 14px; margin-top: 8px; background: #ffffff; padding: 10px; border-radius: 6px; border: 1px solid #fecaca;">💡 해설: ${w.exp}</div>
                    </div>
                `).join('');
            }

            showScreen('screen-student-result');
        }

        function returnToConcept() {
            showScreen('screen-student-concept');
            renderStudentConcept();
        }

        // Admin Functions
        function switchAdminTab(tabId) {
            ['tab-password', 'tab-accounts', 'tab-learning'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            event.target.classList.add('active');
        }

        function changeAdminPassword() {
            const newPw = document.getElementById('new-admin-pw').value.trim();
            if (!newPw) return alert('새 비밀번호를 입력하세요.');
            adminPw = newPw;
            alert('관리자 비밀번호가 성공적으로 변경되었습니다.');
            document.getElementById('new-admin-pw').value = '';
        }

        function saveStudentAccount() {
            const name = document.getElementById('std-name').value.trim();
            const grade = document.getElementById('std-grade').value.trim();
            const gender = document.getElementById('std-gender').value;
            const id = document.getElementById('std-id').value.trim();
            const pw = document.getElementById('std-pw').value.trim();

            if (!name || !id || !pw) return alert('필수 항목을 입력해주세요.');

            const existingIdx = students.findIndex(s => s.id === id);
            if (existingIdx >= 0) {
                students[existingIdx] = { ...students[existingIdx], name, grade, gender, pw };
            } else {
                students.push({
                    id, pw, name, grade, gender,
                    level: 'GRADE 1', chapter: 1, targetScore: 90, lastDate: '-', wrongHistory: []
                });
            }

            saveStudents();
            renderStudentTable();
            renderLearningTable();
            alert('학생 계정이 저장되었습니다.');
        }

        function deleteStudent(id) {
            if (!confirm('정말 삭제하시겠습니까?')) return;
            students = students.filter(s => s.id !== id);
            saveStudents();
            renderStudentTable();
            renderLearningTable();
        }

        function renderStudentTable() {
            const tbody = document.getElementById('student-list-tbody');
            tbody.innerHTML = students.map(s => `
                <tr>
                    <td>${s.name}</td>
                    <td>${s.grade || '-'}</td>
                    <td>${s.gender || '-'}</td>
                    <td>${s.id}</td>
                    <td>${s.pw}</td>
                    <td><button class="btn btn-danger" style="width: auto; padding: 4px 10px; font-size: 12px;" onclick="deleteStudent('${s.id}')">삭제</button></td>
                </tr>
            `).join('');
        }

        function renderLearningTable() {
            const tbody = document.getElementById('learning-list-tbody');
            tbody.innerHTML = students.map((s, idx) => `
                <tr>
                    <td>${s.id} (${s.name})</td>
                    <td>${s.lastDate || '-'}</td>
                    <td>${s.level || 'GRADE 1'} Ch.${s.chapter || 1}</td>
                    <td>Ch.1 ~ Ch.${s.chapter || 1}</td>
                    <td><button class="btn btn-secondary" style="width: auto; padding: 4px 8px; font-size: 12px;" onclick="viewWrongHistory(${idx})">내역보기(${s.wrongHistory ? s.wrongHistory.length : 0})</button></td>
                    <td><input type="number" value="${s.targetScore || 90}" style="width: 60px; text-align: center;" onchange="updateTargetScore('${s.id}', this.value)"></td>
                    <td>
                        <select onchange="assignLevel('${s.id}', this.value)" style="padding: 4px; font-size: 12px;">
                            <option value="PREP">PREP</option>
                            <option value="GRADE 1" ${s.level === 'GRADE 1' ? 'selected' : ''}>GRADE 1</option>
                            <option value="GRADE 2" ${s.level === 'GRADE 2' ? 'selected' : ''}>GRADE 2</option>
                            <option value="GRADE 3" ${s.level === 'GRADE 3' ? 'selected' : ''}>GRADE 3</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }

        function updateTargetScore(id, val) {
            const s = students.find(s => s.id === id);
            if (s) {
                s.targetScore = parseInt(val) || 90;
                saveStudents();
            }
        }

        function assignLevel(id, lvl) {
            const s = students.find(s => s.id === id);
            if (s) {
                s.level = lvl;
                s.chapter = 1;
                saveStudents();
                renderLearningTable();
            }
        }

        function viewWrongHistory(idx) {
            const s = students[idx];
            if (!s.wrongHistory || s.wrongHistory.length === 0) {
                alert('최근 퀴즈 오답 기록이 없습니다.');
                return;
            }
            alert(`[오답 기록 목록]
` + s.wrongHistory.map((w, i) => `${i+1}. ${w.question}
   선택: ${w.userAns} | 정답: ${w.correctAns}`).join('

'));
        }
    </script>
</body>
</html>
