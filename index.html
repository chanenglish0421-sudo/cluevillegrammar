<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Grammar Practice - 청담클루빌어학원</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1E3A8A;
            --primary-light: #3B82F6;
            --primary-dark: #1E293B;
            --accent: #F59E0B;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #475569;
            --border-color: #E2E8F0;
            --danger: #EF4444;
            --success: #10B981;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            word-break: break-word;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Header */
        header {
            width: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, #1D4ED8 100%);
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .user-info-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.95rem;
        }

        .btn-logout {
            background-color: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background-color: white;
            color: var(--primary);
        }

        /* Container */
        .main-container {
            width: 100%;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px 50px 20px;
            flex: 1;
        }

        /* Login Screen */
        .login-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            max-width: 440px;
            margin: 60px auto;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .login-card h2 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .login-card p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
            background-color: #FAFAFA;
        }

        .form-control:focus {
            border-color: var(--primary-light);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
        }

        /* Admin Dashboard */
        .admin-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .admin-tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .admin-tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .admin-section {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 30px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .admin-section h3 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid #EFF6FF;
            padding-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            line-height: 1.5;
        }

        th {
            background-color: #F1F5F9;
            color: var(--text-sub);
            font-weight: 700;
        }

        tr:hover {
            background-color: #F8FAFC;
        }

        .badge-level {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            background-color: #DBEAFE;
            color: #1E40AF;
        }

        /* Concept View Styling */
        .concept-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            box-sizing: border-box;
            overflow: hidden;
            word-break: break-word;
        }

        .concept-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #E0E7FF;
        }

        .concept-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--primary);
        }

        .concept-point {
            background-color: #F8FAFC;
            border-left: 5px solid var(--primary-light);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            text-align: left;
            line-height: 1.8;
            box-sizing: border-box;
            word-break: break-word;
        }

        .concept-point-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 12px;
            display: block;
        }

        .concept-sentence {
            display: block;
            margin-bottom: 10px;
            font-size: 1rem;
            color: var(--text-main);
            text-align: left;
            line-height: 1.7;
        }

        .quiz-action-area {
            margin-top: 40px;
            text-align: center;
        }

        .btn-quiz-start {
            padding: 18px 48px;
            background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
            color: white;
            font-size: 1.3rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }

        .btn-quiz-start:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.5);
        }

        /* Quiz Page Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            position: relative;
        }

        .quiz-progress-bar {
            height: 10px;
            background-color: #E2E8F0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .quiz-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-light), var(--primary));
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .quiz-question {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 35px;
        }

        .option-btn {
            padding: 16px 20px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            background-color: white;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:hover {
            border-color: var(--primary-light);
            background-color: #EFF6FF;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: #DBEAFE;
            color: var(--primary);
            font-weight: 800;
        }

        .quiz-nav-btns {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn-secondary {
            padding: 12px 28px;
            background-color: #E2E8F0;
            color: var(--text-main);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: #CBD5E1;
        }

        /* Modal Wrong Answer Notebook */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: white;
            border-radius: 24px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .wrong-item {
            background-color: #FEF2F2;
            border: 1px solid #FCA5A5;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .wrong-item-q {
            font-weight: 800;
            color: #991B1B;
            font-size: 1.05rem;
            margin-bottom: 10px;
        }

        .wrong-item-ans {
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .wrong-item-exp {
            background-color: white;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.9rem;
            color: #374151;
            margin-top: 10px;
            border-left: 4px solid var(--primary-light);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            <span>청담클루빌어학원</span>
            <span class="brand-badge">Daily Grammar Practice</span>
        </div>
        <div class="user-info-bar" id="userInfoBar" style="display: none;">
            <span id="welcomeMsg"></span>
            <button class="btn-logout" onclick="logout()">로그아웃</button>
        </div>
    </header>

    <div class="main-container">
        <!-- 1. LOGIN SCREEN -->
        <div id="loginScreen" class="login-card">
            <h2>로그인</h2>
            <p>청담클루빌어학원 Daily Grammar Practice</p>
            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" class="form-control" placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label for="loginPw">비밀번호</label>
                <input type="password" id="loginPw" class="form-control" placeholder="비밀번호를 입력하세요">
            </div>
            <button class="btn-primary" onclick="handleLogin()">로그인</button>
        </div>

        <!-- 2. ADMIN DASHBOARD -->
        <div id="adminDashboard" style="display: none;">
            <div class="admin-nav">
                <button class="admin-tab-btn active" onclick="switchAdminTab('learning')">학습 관리</button>
                <button class="admin-tab-btn" onclick="switchAdminTab('students')">학생 계정 생성 및 관리</button>
                <button class="admin-tab-btn" onclick="switchAdminTab('pw')">비밀번호 변경</button>
            </div>

            <!-- Admin Tab 1: Learning Management -->
            <div id="adminTabLearning" class="admin-section">
                <h3>학생 학습 진도 및 목표 점수 관리</h3>
                <table>
                    <thead>
                        <tr>
                            <th>아이디</th>
                            <th>이름</th>
                            <th>학습일자</th>
                            <th>수준 / 진도</th>
                            <th>퀴즈 범위</th>
                            <th>목표 점수</th>
                            <th>설정 변경</th>
                        </tr>
                    </thead>
                    <tbody id="studentProgressTable">
                        <!-- JS populated -->
                    </tbody>
                </table>
            </div>

            <!-- Admin Tab 2: Manage Students -->
            <div id="adminTabStudents" class="admin-section" style="display: none;">
                <h3>학생 계정 추가</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px;">
                    <input type="text" id="newStdName" class="form-control" placeholder="이름">
                    <input type="text" id="newStdGrade" class="form-control" placeholder="학년 (예: 초4)">
                    <select id="newStdGender" class="form-control">
                        <option value="남">남</option>
                        <option value="여">여</option>
                    </select>
                    <input type="text" id="newStdId" class="form-control" placeholder="아이디">
                    <input type="password" id="newStdPw" class="form-control" placeholder="비밀번호">
                </div>
                <button class="btn-primary" style="width: auto; padding: 12px 30px;" onclick="createStudent()">학생 등록</button>

                <h3 style="margin-top: 40px;">학생 목록</h3>
                <table>
                    <thead>
                        <tr>
                            <th>아이디</th>
                            <th>이름</th>
                            <th>학년</th>
                            <th>성별</th>
                            <th>비밀번호</th>
                            <th>관리</th>
                        </tr>
                    </thead>
                    <tbody id="studentAccountTable">
                        <!-- JS populated -->
                    </tbody>
                </table>
            </div>

            <!-- Admin Tab 3: Change Password -->
            <div id="adminTabPw" class="admin-section" style="display: none;">
                <h3>관리자 비밀번호 변경</h3>
                <div style="max-width: 400px;">
                    <div class="form-group">
                        <label>새 비밀번호</label>
                        <input type="password" id="newAdminPw" class="form-control">
                    </div>
                    <button class="btn-primary" onclick="changeAdminPassword()">비밀번호 변경 저장</button>
                </div>
            </div>
        </div>

        <!-- 3. STUDENT VIEW: CONCEPT LEARNING -->
        <div id="studentConceptView" style="display: none;">
            <div class="concept-card">
                <div class="concept-header">
                    <div>
                        <span class="badge-level" id="conceptLevelBadge">GRADE 1</span>
                        <h2 class="concept-title" id="conceptTitle">Chapter 1. be동사</h2>
                    </div>
                </div>

                <div id="conceptContentArea">
                    <!-- Concept points rendered by JS -->
                </div>

                <div class="quiz-action-area">
                    <button class="btn-quiz-start" onclick="startQuiz()">퀴즈풀기</button>
                </div>
            </div>
        </div>

        <!-- 4. STUDENT VIEW: QUIZ PAGE -->
        <div id="studentQuizView" style="display: none;">
            <div class="quiz-card">
                <div class="quiz-progress-bar">
                    <div class="quiz-progress-fill" id="quizProgressFill"></div>
                </div>
                <div class="quiz-meta">
                    <span id="quizChapterBadge">Chapter 1 퀴즈</span>
                    <span id="quizStepIndicator">문제 1 / 20</span>
                </div>

                <div class="quiz-question" id="quizQuestionText">
                    문제 텍스트
                </div>

                <div class="options-grid" id="quizOptionsContainer">
                    <!-- Options buttons rendered by JS -->
                </div>

                <div class="quiz-nav-btns">
                    <button class="btn-secondary" id="btnQuizPrev" onclick="prevQuestion()">이전 문제</button>
                    <button class="btn-primary" id="btnQuizNext" style="width: auto; padding: 12px 30px;" onclick="nextQuestion()">다음 문제</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 5. RESULT & WRONG ANSWER NOTE MODAL -->
    <div id="resultModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 id="modalResultTitle" style="color: var(--primary); margin-bottom: 10px; font-size: 1.8rem;">퀴즈 결과</h2>
            <p id="modalResultScore" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 20px;"></p>
            
            <h3 style="margin-top: 30px; margin-bottom: 15px; text-align: left; color: var(--text-main);">오답 노트 상세 해설</h3>
            <div id="wrongAnswersList">
                <!-- Wrong answers rendered by JS -->
            </div>

            <button class="btn-primary" style="margin-top: 20px;" onclick="closeResultModal()">확인 및 완료</button>
        </div>
    </div>

    <script>
        // EMBEDDED DATABASE PARSED FROM SOURCE TEXTS
        const CONCEPTS_DB = {"PREP": {}, "GRADE 1": {"1": {"level": "GRADE 1", "chapter": 1, "title": "be동사", "points": ["Point 01: 의미와 형태: '~이다, (~에) 있다'(이름/직업/상태/위치). 주어 인칭·수에 따른 현재형(am/are/is) 및 줄임말(I'm, you're 등), 과거형(was/were: 줄여 쓰지 않음, yesterday 등 과거부사와 호응). '명사 and 명사'는 복수(are/were).", "Point 02: 부정문: [be동사 + not] 어순. am not은 줄임말(amn't) 불가(I'm not 사용). is not -> isn't, are not -> aren't, was not -> wasn't, were not -> weren't (과거형 주어+동사 줄임 불가).", "Point 03: 의문문과 응답: [be동사 + 주어~?] 어순. 응답 시 주어는 반드시 인칭대명사 사용. Yes 긍정 대답 시 주어+be동사 축약 불가(Yes, I am (O) / Yes, I'm (X)), No 부정 대답은 축약 가능(No, he wasn't)."]}, "2": {"level": "GRADE 1", "chapter": 2, "title": "일반동사", "points": ["Point 01: 개념과 3인칭 단수 현재형: 주어의 동작/상태 표현 (I/you/we/they/복수주어는 원형). 3인칭 단수 주어는 -(e)s 부가: 대부분 +s, -o/-s/-ch/-sh/-x는 +es, '자음+y'는 y를 i로 바꾸고 +es, '모음+y'는 +s (buys, plays), have -> has.", "Point 02: 과거형 규칙 및 불규칙 변화: 규칙형은 대부분 +ed, -e로 끝남 +d, '자음+y'는 i+ed, '단모음+단자음'은 마지막 자음 겹치고 +ed(stopped). 단, 앞 음절에 강세가 있는 2음절 동사는 자음 중복 없이 +ed(visited, entered). 불규칙형: 동일형(cut, put, read, hurt, hit, set, let) 및 변형(sing-sang, buy-bought, go-went 등).", "Point 03: 부정문과 의문문: 현재형 부정 [don't/doesn't + 동사원형], 과거형 부정 [didn't + 동사원형]. 의문문 [Do/Does/Did + 주어 + 동사원형~?]. 조동사 do/does/did 뒤의 본동사는 주어 시제와 무관하게 항상 동사원형으로 복귀하며 응답 시 인칭대명사 사용."]}, "3": {"level": "GRADE 1", "chapter": 3, "title": "시제", "points": ["Point 01: 현재시제와 과거시제: 현재시제는 현재 사실·상태, 반복적 습관, 불변/과학적 사실, 속담(every day, always 등과 호응). 과거시제는 과거의 동작·상태, 역사적 사실(yesterday, ago 등과 호응하며 역사적 사실은 항상 과거형).", "Point 02: 미래시제 (will / be going to): will + 동사원형(즉흥적 결정·예측·의지, 부정 won't). be going to + 동사원형(예측 또는 미리 정해진 계획, 부정 be not going to). 의문문 [Will + 주어 + 동원~?], [Be + 주어 + going to + 동원~?].", "Point 03: 진행시제와 진행 불가 동사: 현재진행(am/are/is + v-ing), 과거진행(was/were + v-ing). v-ing 규칙: -e는 e 빼고 +ing(단, see->seeing), -ie는 y+ing(die->dying, lie->lying), 단모음+단자음은 자음 겹치고 +ing(단, visit->visiting은 예외). 소유/감정/상태동사(have, like, want, know 등)는 진행형 불가(단, have가 '먹다/시간을 보내다'일 때는 가능)."]}, "4": {"level": "GRADE 1", "chapter": 4, "title": "조동사", "points": ["Point 01: 조동사 기본 특징과 can/may: 동사 앞에 위치하여 의미 추가, 주어 인칭·수 형태 변화 없음, 뒤에는 반드시 동사원형, 조동사 연속 2개 사용 불가. can(능력 '~할 수 있다'=be able to, 허가, 요청/과거형 could). may(약한 추측 '~일지도 모른다', 공손한 허가).", "Point 02: must와 have to: must는 강한 의무('~해야 한다', 부정 금지 must not), 강한 추측('~임에 틀림없다', 부정 추측은 can't '~일 리가 없다'). have to는 의무(주어 3인칭 단수 has to, 과거 had to, 미래 will have to), 부정 [don't/doesn't have to]는 불필요('~할 필요가 없다').", "Point 03: should와 조동사 대용 표현: should는 충고·권고·당위('~하는 것이 좋겠다', 부정 shouldn't). 조동사 중복 불가 규칙에 따라 will can 대신 will be able to, will must 대신 will have to 등의 대용 표현을 사용함."]}, "5": {"level": "GRADE 1", "chapter": 5, "title": "명사와 관사", "points": ["Point 01: 셀 수 있는 명사의 복수형: 규칙: 대부분 +s, -s/-x/-ch/-sh/-o는 +es(예외: photo, piano, zoo는 +s), 자음+y는 i+es, -f/-fe는 v+es(예외: roof는 roofs). 불규칙: man-men, foot-feet, mouse-mice, child-children 등, 단복수 동형(sheep, deer, fish), 항상 복수/짝 명사(glasses, pants, scissors 등 -> a pair of).", "Point 02: 셀 수 없는 명사와 수량 표현: 물질·추상·고유명사는 a/an 및 복수형 불가, 항상 단수 취급. 물질명사 수량은 단위명사 활용(a cup of, a glass of, a bottle of, a slice of, a loaf of bread, a sheet of paper 등). 2 이상 복수 수량 표현 시 단위명사에만 s/es 부가(two cups of coffee).", "Point 03: 관사 (a/an, the, 무관사): 부정관사 a/an은 첫 '발음' 기준(an hour, a university). 정관사 the는 재언급, 서로 아는 것, 수식받는 명사, 세상에 유일한 것(the sun, the earth), 악기명, 서수 앞. 관사 생략: 식사·과목·운동경기 이름, [by + 교통·통신수단], 장소 본래 목적(go to bed/school)."]}, "6": {"level": "GRADE 1", "chapter": 6, "title": "대명사", "points": ["Point 01: 인칭대명사와 재귀대명사: 인칭대명사 격 변화(주격·소유격·목적격·소유대명사, it은 소유대명사 없음, its vs it's 구별). 재귀대명사(-self/-selves): 재귀 용법(주어=목적어, 생략 불가), 강조 용법(생략 가능). 관용 표현: by oneself (혼자서), enjoy oneself (즐거운 시간 보내다), help oneself (마음껏 먹다).", "Point 02: 지시대명사와 비인칭 주어 it: 지시대명사 this/these(가까운 대상, 전화 소개), that/those(멀리 있는 대상). 의문문에 대한 답변 시 this/that은 it, these/those는 they로 받음. 비인칭 주어 it은 시간·날짜·요일·계절·날씨·거리·명암에 쓰이며 '그것'으로 해석하지 않음.", "Point 03: 부정대명사 (one, some, any): one은 앞에 나온 명사와 '동일 종류 불특정 대상'(복수 ones, 특정 1:1 대상은 it). some은 긍정문 및 권유/긍정 기대 의문문에 사용. any는 부정문, 일반 의문문, 조건문에 사용."]}, "7": {"level": "GRADE 1", "chapter": 7, "title": "문장의 형식", "points": ["Point 01: 2형식(S+V+C): 주어의 상태나 성질 보충. 감각동사(look, sound, smell, taste, feel) 뒤에는 반드시 형용사 보어 사용(부사 불가).", "Point 02: 4형식(S+V+IO+DO): 수여동사 구문. 3형식 전환 시 간접목적어 앞에 전치사 to(give, send 등), for(make, buy 등), of(ask) 연결.", "Point 03: 5형식(S+V+O+OC): 목적어를 보충 설명하는 목적격보어로 명사나 형용사 사용(부사 불가). 원형부정사·to부정사를 취하는 동사 구별."]}, "8": {"level": "GRADE 1", "chapter": 8, "title": "문장의 종류", "points": ["Point 01: 의문사 의문문: who, what, which, when, where, why, how 등으로 시작하며 Yes/No로 대답하지 않고 구체적 정보로 답변.", "Point 02: 명령문, 제안문, There is/are: 명령문(동사원형 시작, 부정은 Don't), 제안문(Let's + 동사원형), There is/are는 뒤에 오는 명사가 진짜 주어.", "Point 03: 감탄문과 부가의문문: What a(n) 형명주동! / How 형/부 주동! 부가의문문은 앞이 긍정이면 부정, 부정이면 긍정 조동사+대명사."]}, "9": {"level": "GRADE 1", "chapter": 9, "title": "형용사, 부사, 비교구문", "points": ["Point 01: 형용사와 수량 형용사: 명사 수식 및 보어 역할. many/few(셀 수 있는 명사 복수), much/little(셀 수 없는 명사 단수).", "Point 02: 부사와 빈도부사: 동사·형용사·다른 부사 수식. 빈도부사(always, often 등) 위치는 '조동사/be동사 뒤, 일반동사 앞'.", "Point 03: 비교구문: 원급(as~as), 비교급(비교급 + than), 최상급(the + 최상급). 비교급 강조는 much, even, still, far, a lot 사용(very 불가)."]}, "10": {"level": "GRADE 1", "chapter": 10, "title": "to부정사와 동명사", "points": ["Point 01: to부정사의 명사적 용법: 주어, 목적어, 보어로 쓰여 '~하는 것'으로 해석. 주어로 쓰일 때 가주어 it과 진주어 to부정사 구조 사용.", "Point 02: to부정사의 형용사적·부사적 용법: 형용사적 용법(명사 뒤에서 수식 '~할'), 부사적 용법(목적 '~하기 위해', 감정의 원인 등).", "Point 03: 동명사와 목적어 구분: 동명사는 동사원형+-ing로 명사 역할. enjoy/finish 등은 동명사만, want/hope 등은 to부정사만 목적어로 취함."]}, "11": {"level": "GRADE 1", "chapter": 11, "title": "전치사", "points": ["Point 01: 장소와 위치의 전치사: at(좁은 장소·지점), in(넓은 장소·공간 내부), on(표면 접촉), under(~아래에), in front of(~앞에), behind(~뒤에), next to(~옆에), between A and B(A와 B사이).", "Point 02: 시간의 전치사: at(구체적 시각), on(특정 날짜·요일), in(월·연도·계절). for(숫자 기간), during(특정 기간 명사). by(완료 기한~까지), until(동작 계속~까지).", "Point 03: 기타 전치사 및 관용 표현: with(~와 함께·도구), without(~없이), by(~수단). 전치사 뒤 대명사는 목적격 사용. be good at(~에 능숙하다), be famous for(~로 유명하다), be interested in(~에 관심 있다) 등."]}, "12": {"level": "GRADE 1", "chapter": 12, "title": "접속사", "points": ["Point 01: 등위접속사(and, but, or, so): 단어·구·절을 대등하게 연결하며 동사 연결 시 시제와 수 일치 주의(병렬 구조). and(그리고), but(그러나), or(또는), so(원인과 결과).", "Point 02: 종속접속사 부사절(시간·이유·조건): when(~할 때), before/after(~전/후에), because(~때문에; because of+명사구). 시간·조건 부사절(when, if)에서는 미래 시제 대신 현재 시제 사용.", "Point 03: 명사절 접속사 that: [that+주어+동사] 구조로 문장의 주어, 목적어, 보어 역할 수행, 주어일 때 가주어 it 구문 활용, 타동사의 목적어로 쓰일 때 that 생략 가능."]}}, "GRADE 2": {"1": {"level": "GRADE 2", "chapter": 1, "title": "문장의 형식", "points": ["Point 01: [2형식 문장 (S+V+C)] 구조: 주어 + 동사 + 주격보어 (주격보어 품사는 명사, 형용사만 가능, 부사는 보어 불가). 감각동사(look, smell, sound, taste, feel) + 형용사. 명사 보어 수반 시 「감각동사+like+명사」. 상태 유지/변화 동사: be, become, get, grow, keep, turn 등.", "Point 02: [4형식 문장 (S+V+IO+DO)] 구조: 주어 + 수여동사 + 간접목적어(~에게) + 직접목적어(~을/를). 3형식 전환(S+V+DO+전치사+IO): - to 쓰는 동사: give, send, show, tell, teach, write / - for 쓰는 동사: make, buy, cook, get, find, build / - of 쓰는 동사: ask", "Point 03: [5형식 문장 (S+V+O+OC)] 구조: 주어 + 동사 + 목적어 + 목적격보어. to부정사를 목적격보어로 취하는 동사: want, ask, tell, teach, expect, allow, order, advise. 사역동사(make, have, let) + 목적어 + 동사원형 (help는 동사원형/to부정사 둘 다 가능). 지각동사(see, watch, hear, listen to, smell, feel) + 목적어 + 동사원형/v-ing."]}, "2": {"level": "GRADE 2", "chapter": 2, "title": "시제", "points": ["Point 01: [단순시제(현재/과거/미래)] 현재시제: 현재 상태/습관, 과학적 사실, 불변의 진리. 시간표/정해진 미래 일정은 미래여도 현재시제 사용. 시간/조건 부사절(when, if 등)에서는 미래 일도 현재시제 사용. 과거시제: 과거 특정 시점의 일/상태, 역사적 사실. 미래시제: will(순간적 의지/예측), be going to(사전 계획/예정).", "Point 02: [진행시제 (진행형)] 형태: be동사 + v-ing (현재/과거/미래진행). 진행형 불가 동사: 상태, 소유, 감각, 감정, 인지 동사 (have, see, hear, love, want, know, remember). 예외: have가 '먹다, 시간을 보내다' 등 동작 의미일 때는 진행형 가능.", "Point 03: [현재완료시제 (have/has + p.p.)] 의미: 과거에 일어난 일이 현재까지 영향을 미침. 4대 용법: 1) 계속(for, since) 2) 경험(ever, never, before, once) 3) 완료(just, already, yet) 4) 결과(have gone to, have lost). 주의: 특정 과거 부사(yesterday, ago, last~, when 등)와 함께 사용 불가."]}, "3": {"level": "GRADE 2", "chapter": 3, "title": "조동사", "points": ["Point 01: [can, may] can: 능력(~할 수 있다 = be able to), 허가, 요청, 부정 추측(~일 리가 없다 = can't). may: 약한 추측(~일지도 모른다), 정중한 허가(~해도 좋다). 규칙: 조동사 뒤에는 항상 동사원형, 조동사 두 개 연속 사용 불가(will can 불가 -> will be able to).", "Point 02: [must, have to, should] must: 강한 의무(~해야 한다 = have to), 강한 확신/추측(~임에 틀림없다). must not: 금지(~해서는 안 된다). don't have to: 불필요(~할 필요가 없다 = don't need to / need not). have to 과거형: had to, 미래형: will have to. should: 약한 의무, 권유/충고(~하는 편이 좋다).", "Point 03: [had better, used to, would like to] had better: 강한 충고/경고(~하는 게 낫다, 부정형: had better not). used to: 과거의 규칙적 습관/상태(~하곤 했다, 상태는 would로 대체 불가). 구별: be used to -ing(~에 익숙하다) vs be used to v원형(~에 사용되다). would like to + 동원: 희망/요청(~하고 싶다 = want to)."]}, "4": {"level": "GRADE 2", "chapter": 4, "title": "to부정사", "points": ["Point 01: [명사적 용법] 형태: to + 동사원형 (부정: not/never to-v). 역할: 주어(단수 취급, 가주어 It~진주어 구문 다용), 목적어, 보어. 목적어로 취하는 동사: want, hope, decide, plan, promise, expect, wish 등. 의문사 + to부정사: 명사구 역할 (의문사 + 주어 + should + 동사원형 전환, 단 why to-v는 불가).", "Point 02: [형용사적/부사적 용법] 형용사적: 명사/대명사 뒤에서 수식 (~할/하는), 명사가 전치사의 목적어일 때 전치사 필수 (chair to sit on). -thing/-one/-body 명사는 형용사 + to-v 순서 (something cold to drink). 부사적 용법: 목적(~하기 위해 = in order to, so as to), 감정의 원인(~해서), 판단의 근거(~하다니), 결과(~해서 결국 ~하다), 형용사 수식(~하기에).", "Point 03: [의미상 주어 및 주요 구문] 의미상 주어: 일반적인 경우 for + 목적격 / 사람 성격·태도 형용사(kind, nice, foolish, polite 등)는 of + 목적격. too ~ to-v: 너무 ~해서 ~할 수 없다 (= so ~ that + 주어 + can't). 형용사/부사 + enough to-v: ...할 만큼 충분히 ~하다 (= so ~ that + 주어 + can)."]}, "5": {"level": "GRADE 2", "chapter": 5, "title": "동명사", "points": ["Point 01: [동명사의 형태 및 역할] 형태: 동사원형-ing (부정: not/never + 동명사). 역할: 명사 역할 (주어-단수취급, 목적어-동사/전치사의 목적어, 주격보어). 주요 관용표현: look forward to -ing(~를 고대하다), spend 시간/돈 -ing(~하는 데 쓰다), cannot help -ing(~하지 않을 수 없다), be busy -ing(~하느라 바쁘다), feel like -ing(~하고 싶다).", "Point 02: [동명사 vs to부정사 목적어] 동명사만 목적어로 취함: enjoy, finish, avoid, mind, give up, quit, practice, suggest 등. to부정사만 목적어로 취함: want, hope, decide, plan, expect, refuse, promise 등. 둘 다 가능 (의미 동일): love, like, hate, start, begin, continue, prefer.", "Point 03: [동명사 vs to부정사 의미 차이] remember/forget: - to-v: (미래에) ~할 것을 기억/잊다 / - -ing: (과거에) ~했던 것을 기억/잊다. try: - to-v: ~하려고 노력/애쓰다 / - -ing: 시험 삼아 ~해 보다. stop: - -ing: (동명사 목적어) ~하는 것을 멈추다 / - to-v: (to부정사 부사적 용법) ~하기 위해 멈추다."]}, "6": {"level": "GRADE 2", "chapter": 6, "title": "수동태", "points": ["Point 01: [수동태의 개념 및 기본 형태] 개념: 주어가 동작을 받거나 당하는 것 (행위 대상 강조). 기본형: be동사 + 과거분사(p.p.) (+ by + 행위자). 능동태의 목적어가 수동태의 주어가 됨 (3형식 이상 타동사만 수동태 가능). 수동태 불가 동사: 자동사(happen, appear, disappear 등), 상태/소유 타동사(have, resemble, lack 등).", "Point 02: [시제별 형태 및 부정/의문문] 시제별 형태: 현재: am/are/is + p.p. / 과거: was/were + p.p. / 미래: will be + p.p. / 조동사: 조동사 + be + p.p. 부정문: be동사/조동사 뒤 not 위치 (be + not + p.p. / 조동사 + not + be + p.p.). 의문문: Be동사 + 주어 + p.p.~? / 조동사 + 주어 + be + p.p.~? by + 행위자 생략: 일반인, 불분명하거나 언급할 필요가 없을 때.", "Point 03: [by 이외의 전치사를 쓰는 수동태 표현] be interested in(~에 관심이 있다), be surprised at(~에 놀라다), be filled with(~로 가득 차다), be covered with(~로 덮여 있다), be satisfied/pleased with(~에 만족/기뻐하다), be worried about(~에 대해 걱정하다), be known to(~에게 알려지다) / for(~로 유명하다) / as(~로 알려지다), be made of(물리적 변화) / from(화학적 변화)."]}, "7": {"level": "GRADE 2", "chapter": 7, "title": "분사와 분사구문", "points": ["Point 01: [분사의 종류 및 역할] 현재분사(v-ing): 능동/진행의 의미 (~하는, ~하고 있는). 과거분사(p.p.): 수동/완료의 의미 (~된, ~해진). 역할: 명사 수식(단독은 명사 앞, 수식어구 동반은 명사 뒤), 보어(주격/목적격보어). 동명사(명사/용도) vs 현재분사(형용사/동작 진행) 구별. 감정유발 분사: 감정을 일으키는 주체(사물 등)는 v-ing, 감정을 느끼는 주체(사람)는 p.p.", "Point 02: [분사구문의 개념 및 만드는 법] 개념: 접속사 + 주어 + 동사의 부사절을 분사(v-ing)를 이용해 간결하게 만드는 구문. 만드는 법: 1) 접속사 생략 (의미 명확화 시 접속사를 남기기도 함) 2) 부사절 주어 = 주절 주어일 때 부사절 주어 생략 3) 부사절 동사 시제 = 주절 동사 시제일 때 동사원형-ing. Being 생략: being으로 시작하는 분사구문에서 being은 생략 가능 (p.p.만 남음).", "Point 03: [분사구문의 의미 및 부정형] 분사구문의 다양한 의미: 1) 시간: ~할 때(when), ~하는 동안(while), ~한 후에(after) 2) 이유/원인: ~해서, ~때문에(because, as, since) 3) 조건: (만약) ~한다면(if) 4) 양보: 비록 ~일지라도(although) 5) 동시동작/연속: ~하면서(as, while), 그리고 ~하다(and). 부정형: 분사 바로 앞에 not/never 위치 (Not/Never + v-ing)."]}, "8": {"level": "GRADE 2", "chapter": 8, "title": "대명사", "points": ["Point 01: [부정대명사 1 (one, another, other)] one: 앞에 나온 명사와 동일한 종류의 불특정 사물/사람 (복수: ones; 동일 대상은 it/they). another: 또 다른 하나 (단수 취급). 둘 중 구분: 하나는 one, 나머지 하나는 the other. 셋 중 구분: 하나는 one, 또 다른 하나는 another, 나머지 하나는 the other. 불특정 다수: 일부는 some, 다른 일부는 others. 특정 범위 전체: 일부는 some, 나머지 전체는 the others.", "Point 02: [부정대명사 2 (each, every, all, both, -thing)] each: '각각' (대명사/형용사 모두 가능), 단수명사 수식 단수동사 취급. every: '모든' (형용사만 가능), 단수명사 수식 단수동사 취급. both: '둘 다' (항상 복수 취급). all: '모든 것/사람' (복수명사와 쓰이면 복수 취급, 셀 수 없는 명사와 쓰이면 단수 취급). -thing/-one/-body: 단수 취급, 형용사/to부정사가 뒤에서 후치 수식.", "Point 03: [재귀대명사 (-self/-selves)] 형태: 단수 -self, 복수 -selves. 1) 재귀 용법: 주어와 목적어가 같을 때 목적어로 사용 (생략 불가). 2) 강조 용법: 주어나 목적어를 직접 강조 ('스스로, 직접'), 문장 성분이 아니므로 생략 가능. 주요 관용표현: by oneself(혼자서), for oneself(혼자 힘으로), enjoy oneself(즐기다), talk to oneself(혼잣말하다), help oneself to(마음껏 먹다)."]}, "9": {"level": "GRADE 2", "chapter": 9, "title": "비교구문", "points": ["Point 01: [원급, 비교급, 최상급 기본] 원급 비교: 「as + 원급 + as」 (~만큼 ...한/하게), 부정형 「not as/so + 원급 + as」 (~만큼 하지 않은). 비교급 비교: 「비교급 + than」 (~보다 더 ...한/하게). 비교급 강조 부사: much, even, still, far, a lot ('훨씬', very/so는 비교급 강조 불가). 최상급 비교: 「the + 최상급 + in(장소/단수명사)/of(복수명사/범위)」. 불규칙 변화: good/well-better-best, bad/ill-worse-worst, many/much-more-most, little-less-least.", "Point 02: [비교구문의 주요 응용 표현 1] 배수 표현: 배수사(twice, three times 등) + as + 원급 + as / 배수사 + 비교급 + than (~보다 몇 배 더 ...한). 가능한 한 ~하게: 「as + 원급 + as possible」 / 「as + 원급 + as + 주어 + can/could」. 점점 더 ~한: 「비교급 + and + 비교급」 (예: more and more, warmer and warmer).", "Point 03: [비교구문의 주요 응용 표현 2] 비례 비교: 「The + 비교급 ~, the + 비교급 ...」 (~하면 할수록 더욱더 ...하다). 최상급 응용: 「one of the + 최상급 + 복수명사」 (가장 ~한 것들 중 하나, 주의: 이 구문이 주어로 쓰일 때 one이 핵어이므로 단수 취급). 원급/비교급을 이용한 최상급 의미 표현 (No other is as... as / No other is... -er than)."]}, "10": {"level": "GRADE 2", "chapter": 10, "title": "접속사", "points": ["Point 01: [등위접속사 및 상관접속사] 등위접속사: and, but, or, so - 문법적으로 대등한 요소 연결. 명령문 구문: - 「명령문, and ~」: ~해라, 그러면 ...할 것이다 / - 「명령문, or ~」: ~해라, 그렇지 않으면 ...할 것이다. 상관접속사 (주어 자리 수 일치): - both A and B: 항상 복수 취급 / - not only A but also B (= B as well as A): B에 수 일치 / - either A or B / neither A nor B: B에 수 일치.", "Point 02: [종속접속사: 부사절 접속사] 시간: when, while, before, after, until, since, as. 이유: because, since, as (주의: because + 절 vs because of + 명사(구)). 조건: if(만약 ~라면), unless(만약 ~하지 않으면 = if ~ not). 양보: although, though, even though (비록 ~이지만). 목적/결과: so that~(목적), so + 형/부 + that..(결과: 너무 ~해서 ..하다). 시제 규칙: 시간/조건 부사절에서는 미래 일도 '현재시제' 사용.", "Point 03: [종속접속사: 명사절 및 간접의문문] 명사절 접속사 that: '~라는 것' (주어, 목적어, 보어 역할 / 주어일 때 단수 취급, 가주어-진주어 구문 활용 / 목적어절 that 생략 가능). 간접의문문: - 의문사 있는 경우: 「의문사 + 주어 + 동사」 (단, 의문사가 주어면 의문사 + 동사) / - 의문사 없는 경우: 「if/whether + 주어 + 동사」 (~인지 아닌지)."]}, "11": {"level": "GRADE 2", "chapter": 11, "title": "관계사", "points": ["Point 01: [관계대명사의 개념 및 격별 역할] 개념: 접속사 + 대명사 역할, 앞에 오는 명사(선행사)를 수식하는 형용사절 유도. 주격 관계대명사: who, which, that (뒤에 동사가 이어지며 선행사에 수 일치). 목적격 관계대명사: who(m), which, that (뒤에 주어+동사가 오며 목적어가 빠진 불완전한 절). 소유격 관계대명사: whose (뒤에 무관사 명사가 옴, that으로 대체 불가). 선행사가 사람: who(m) / 사물·동물: which / 사람·사물·동물: that.", "Point 02: [관계대명사 what 및 관계대명사의 생략] 관계대명사 what: 선행사를 포함하는 관계대명사 (= the thing(s) which/that, '~한 것'). - 명사절 역할 (문장의 주어, 목적어, 보어로 쓰임). - what절이 주어로 쓰일 때는 원칙적으로 단수 취급. 목적격 관계대명사의 생략: 단독으로 쓰인 목적격 관계대명사는 생략 가능. (주의: 「전치사 + 목적격 관계대명사」 구조에서는 관계대명사 생략 불가, that/who 사용 불가). 「주격 관계대명사 + be동사」의 생략: 뒤에 분사(v-ing/p.p.)나 형용사구가 올 때 함께 생략 가능.", "Point 03: [관계부사 (when, where, why, how)] 개념: 접속사 + 부사(구) 역할, 선행사를 수식하며 뒤에 완전한 절이 이어짐. 전환: 「전치사 + 관계대명사」로 바꾸어 쓸 수 있음. 종류별 선행사: - 시간(the time, day 등) -> when (at/on/in which) / - 장소(the place, house 등) -> where (at/in/on which) / - 이유(the reason) -> why (for which) / - 방법(the way) -> how (in which). 주의: the way와 how는 반드시 둘 중 하나만 써야 함 (the way how 불가)."]}, "12": {"level": "GRADE 2", "chapter": 12, "title": "가정법", "points": ["Point 01: [가정법 과거 vs 단순 조건문] 가정법 과거: 현재 사실과 반대되거나 실현 가능성이 매우 희박한 일을 가정 (~라면 ..할 텐데). - 형태: If + 주어 + 동사의 과거형(be동사는 인칭 무관 were), 주어 + would/could/might + 동사원형. - 직설법 전환: 현재 시제 직설법으로 전환 시 긍정/부정이 반대로 바뀜 (As/Because + 주어 + 현재동사). 단순 조건문과의 구별: - 조건문: 실현 가능성이 있는 단순 조건 (If + 주어 + 현재시제, 주어 + will/can + 동사원형). - 가정법: 현재 사실에 반대되는 상상/가정.", "Point 02: [가정법 과거완료] 개념: 과거 사실과 반대되는 일이나 과거에 이루지 못한 일을 가정 (~했더라면 ..했했을 텐데). 형태: If + 주어 + had + p.p., 주어 + would/could/might + have + p.p. 직설법 전환: 과거 시제 직설법으로 전환하며 긍정/부정이 반대로 바뀜 (As/Because + 주어 + 과거동사). 혼합가정법: 과거의 일이 현재까지 영향을 미칠 때 (If + 주어 + had p.p., 주어 + 조동사과거형 + 동사원형 + now).", "Point 03: [I wish / as if 가정법] I wish 가정법: 실현하기 어려운 현재나 과거의 소망·아쉬움 서술 (~하면 좋을 텐데 / ~했더라면 좋았을 텐데). - I wish + 주어 + 과거동사(were): 현재 사실과 반대되는 소망 (I'm sorry that + 주어 + 현재동사). - I wish + 주어 + had p.p.: 과거 사실과 반대되는 소망/후회 (I'm sorry that + 주어 + 과거동사). as if [as though] 가정법: 마치 ~인 것처럼 / 마치 ~였던 것처럼. - as if + 주어 + 과거동사: 주절 시점의 사실과 반대 (In fact, 주어 + 현재/과거 반대 사실). - as if + 주어 + had p.p.: 주절 시점보다 앞선 사실과 반대."]}}, "GRADE 3": {"1": {"level": "GRADE 3", "chapter": 1, "title": "Chapter 1", "points": ["Unit 1. 현재완료 - 현재완료의 형태와 4가지 용법\n• 형태/공식: have/has + 과거분사(p.p.)\n• 개념설명: 과거에 일어난 일이 현재까지 영향을 미칠 때 사용. 4가지 용법: ① 완료(just, already, yet), ② 경험(ever, never, before, once, often), ③ 계속(for + 기간, since + 시작시점), ④ 결과(과거의 동작 결과가 현재 상태로 남아있음, have lost, have gone).\n• 예문: I have just finished my homework. / Have you ever visited Paris? / She has lived here for 10 years (since 2014). / He has lost his wallet (so he doesn't have it now).", "Unit 1. 현재완료 - 현재완료 주의 규칙 및 예외\n• 형태/공식: 명확한 과거 시점 부사와 함께 사용 불가\n• 개념설명: 명확한 과거 시점을 나타내는 어휘(yesterday, ago, last ~, in + 과거연도, just now, When 의문문)와는 현재완료를 쓸 수 없으며 반드시 단순과거 시제를 써야 함. 단, since + 과거시점은 현재완료와 함께 사용 가능.\n• 예문: I saw the movie yesterday. (I have seen... 불가) / When did you meet him? (When have you met... 불가) / I have known him since last year. (가능)", "Unit 1. 현재완료 - have been to vs have gone to 비교\n• 형태/공식: have been to: 경험/완료 vs have gone to: 결과\n• 개념설명: have been to + 장소: '~에 가본 적이 있다'(경험) 또는 '~에 다녀왔다'(완료). 주어로 1, 2, 3인칭 모두 사용 가능. have gone to + 장소: '~로 가버렸다'(결과, 현재 여기 없음). 원칙적으로 1인칭(I, We)과 2인칭(You)은 주어로 사용 불가(3인칭 주어만 가능).\n• 예문: She has been to London twice. (경험: 런던에 가본 적 있다) / He has gone to London. (결과: 런던으로 가버려서 지금 여기 없다. I have gone to London은 비문법적)", "Unit 2. 현재완료진행형 - 현재완료진행형의 개념 및 상태동사 예외\n• 형태/공식: have/has + been + v-ing\n• 개념설명: 과거에 시작된 동작이 현재에도 여전히 진행 중임을 강조('~해 오고 있는 중이다'). 상태동사(know, have[소유], like, love, be, exist, understand, resemble 등)는 동작이 아니므로 진행형(현재완료진행 포함) 불가하며 현재완료로 대신 표현함.\n• 예문: It has been raining since this morning. / I have known him for five years. (I have been knowing him... 은 상태동사이므로 불가)", "Unit 3. 과거완료 및 대과거 - 과거완료의 개념 및 현재완료와의 비교\n• 형태/공식: had + 과거분사(p.p.)\n• 개념설명: 과거의 특정 기준 시점 이전에 일어난 동작이나 상태를 나타냄(완료, 경험, 계속, 대과거). 현재완료는 과거와 '현재'를 잇는 반면, 과거완료는 대과거와 '과거의 특정 시점'을 잇는 시제임. 두 과거 사건의 전후 관계가 명확할 때 먼저 일어난 일에 had+p.p.(대과거)를 사용함.\n• 예문: When I arrived at the station, the train had already left. / I had lost the watch that my father bought for me.", "Unit 4. 과거완료진행형 - 과거완료진행형의 개념 및 쓰임\n• 형태/공식: had + been + v-ing\n• 개념설명: 과거의 특정 시점 이전부터 그 과거 시점까지 동작이 계속해서 진행되고 있었음을 강조함('~해 오고 있던 중이었다').\n• 예문: She had been waiting for two hours when he finally arrived. / He was out of breath because he had been running.", "Unit 5. 미래완료 및 미래완료진행형 - 미래완료(진행형)의 개념과 기준 부사구\n• 형태/공식: 미래완료: will have p.p. / 미래완료진행: will have been v-ing\n• 개념설명: 미래의 특정 기준 시점까지 어떤 일의 완료, 경험, 계속을 나타냄. 기준 시점을 나타내는 부사구(by tomorrow, by next year, before, until then 등)와 주로 함께 쓰임. 미래완료진행형은 미래의 특정 시점까지도 동작이 계속 진행 중일 것임을 강조함.\n• 예문: By next month, I will have finished this project. / By next year, they will have been living here for ten years."]}, "2": {"level": "GRADE 3", "chapter": 2, "title": "Chapter 2", "points": ["Unit 1. 조동사의 기본 규칙 - 조동사의 기본 성질 및 중복 사용 불가\n• 형태/공식: 조동사 + 동사원형 (S + modal + V-root)\n• 개념설명: 조동사 뒤에는 항상 동사원형이 오며 주어의 인칭·수에 따른 3인칭 단수를 붙이지 않음. 두 개의 서법 조동사는 나란히 겹쳐 쓸 수 없음(will can 불가 -> will be able to로 대체, will must 불가 -> will have to로 대체).\n• 예문: He can speak French. (can speaks 불가) / I will be able to finish it tomorrow. (will can finish 불가) / She will have to leave early. (will must leave 불가)", "Unit 2. must not vs don't have to - 금지와 불필요의 구분\n• 형태/공식: must not + 동원 vs don't/doesn't have to + 동원\n• 개념설명: ① must not: 강한 금지('~해서는 안 된다'). 위반 시 벌칙이나 위험이 따름. ② don't have to: 불필요('~할 필요가 없다' = need not + 동원, don't need to + 동원).\n• 예문: You must not touch this wire; it's dangerous. (금지) / Tomorrow is Sunday, so you don't have to get up early. (불필요 = need not get up)", "Unit 3. had better & would rather - had better와 would rather의 용법 및 부정형\n• 형태/공식: had better + 동원 / would rather + 동원 (than)\n• 개념설명: ① had better + 동원: 강한 권고 및 경고('~하는 편이 좋다. 안 그러면 불이익이 있다'). 부정형은 had better not + 동원(had not better 불가). ② would rather + 동원 (than + 동원): 차라리 ~하겠다('~하는 편이 낫다'). 부정형은 would rather not + 동원.\n• 예문: You had better see a doctor right now. / You had better not go out tonight. (부정어 위치 주의) / I would rather stay at home than go to the party. / I would rather not talk about it.", "Unit 4. used to 3형제 비교 - used to vs be used to v vs be used to v-ing\n• 형태/공식: used to + 동원 / be used to + 동원 / be used to + v-ing(명사)\n• 개념설명: ① used to + 동원: 과거의 규칙적 습관('~하곤 했다') 또는 과거의 지속적 상태('예전에는 ~였다/있었다'). 과거 상태를 나타낼 때는 would를 쓸 수 없음(규칙적 동작 습관만 would 가능). ② be used to + 동원: '~하는 데 사용되다'(use의 단순 수동태). ③ be used to + v-ing/명사: '~에 익숙하다'(to는 전치사).\n• 예문: There used to be a big tree here. (상태: would 불가) / Wood is used to make paper. (수동태: 사용되다) / I am used to waking up early. (익숙하다: to 뒤 동명사)", "Unit 5. 조동사 + have + p.p. - 과거 사실에 대한 추측 및 후회/유감\n• 형태/공식: 조동사 + have + 과거분사(p.p.)\n• 개념설명: 과거 일에 대한 추측이나 후회를 나타냄: ① must have p.p.: '~했음에 틀림없다'(강한 확신), ② can't have p.p.: '~했을 리가 없다'(강한 부정적 확신), ③ may/might have p.p.: '~했을지도 모른다'(약한 추측), ④ should have p.p.: '~했어야 했는데 (안했다)'(후회/유감), ⑤ shouldn't have p.p.: '~하지 말았어야 했는데 (했다)'.\n• 예문: He must have missed the bus. (틀림없다) / She cannot have said so. (했을 리 없다) / You should have studied harder. (공부했어야 했는데 안 했다) / I shouldn't have eaten so much. (먹지 말았어야 했는데 먹었다)"]}, "3": {"level": "GRADE 3", "chapter": 3, "title": "Chapter 3", "points": ["Unit 1. 수동태의 기본 형태 및 수동태 불가 동사 - 수동태 기본 형태와 수동태 불가 자동사 및 상태타동사\n• 형태/공식: be + 과거분사(p.p.) (by + 행위자)\n• 개념설명: 수동태는 목적어가 있는 타동사 문장에서만 가능. ① 완전자동사(목적어 불필요): exist, appear, disappear, happen, occur, seem, remain, arrive 등은 수동태 불가(is happened 불가). ② 소유·상태 타동사: have(소유), resemble, belong to, fit, lack, own 등은 타동사이지만 수동태 불가(is resembled by 불가).\n• 예문: The accident happened yesterday. (was happened 불가) / He resembles his father. (His father is resembled by him 불가) / The letter was written by Mary.", "Unit 2. 시제 및 조동사 수동태 - 진행형, 완료형, 조동사 결합 수동태\n• 형태/공식: 진행 수동: be being p.p. / 완료 수동: have/has/had been p.p. / 조동사 수동: 조동사 + be p.p.\n• 개념설명: 진행 시제와 결합 시 'be being p.p.', 완료 시제와 결합 시 'have/has/had been p.p.', 조동사와 결합 시 '조동사 + be p.p.' 형태를 취함. 부정문은 첫 번째 조동사/be동사 바로 뒤에 not을 붙임.\n• 예문: The car is being repaired now. / The project has been completed. / The rule must be followed by everyone.", "Unit 3. 4형식 수동태와 전치사 구분 - 간접목적어와 직접목적어의 수동태 전환 및 전치사\n• 형태/공식: 직접목적어 주어 수동태: S(직목) + be p.p. + [to/for/of] + O(간목) + by O\n• 개념설명: 4형식은 목적어가 2개(간목, 직목)이므로 원칙적으로 2개의 수동태 가능. 단, 직목이 주어가 될 때 간목 앞에 붙는 전치사: ① to (give, send, teach, show, lend, pass, tell...), ② for (buy, make, cook, get, find, build...), ③ of (ask). ★주의: buy, make, cook, write, bring, find, get 등은 간접목적어를 주어로 쓰는 수동태를 쓰지 않고 직접목적어만 주어로 씀.\n• 예문: A nice sweater was bought for me by Mom. (I was bought a sweater by Mom은 불가) / A story was told to us by the teacher. / A difficult question was asked of him.", "Unit 4. 5형식 수동태 (지각동사·사역동사) - 목적격보어의 형태 변화 (원형부정사 -> to부정사)\n• 형태/공식: 능동: S + 지각/사역(make) + O + 동원 -> 수동: O + be p.p. + to부정사\n• 개념설명: 능동태에서 목적격보어로 동사원형이 쓰인 지각동사(see, hear, watch)와 사역동사 make는 수동태로 바뀔 때 반드시 'to부정사'로 전환됨! 단, 지각동사의 목적격보어로 쓰인 현재분사(-ing)는 수동태에서도 그대로 -ing 유지. 사역동사 let은 수동태로 전환 시 'be allowed to v'로 바꾸고, have는 ask/order의 수동태로 우회 표현함.\n• 예문: We made him clean the room. -> He was made to clean the room by us. / I saw her dance (dancing). -> She was seen to dance (dancing). / Mom let me go out. -> I was allowed to go out by Mom.", "Unit 5. 동사구 및 that절 수동태 - 동사구 수동태와 that절 목적어 구문의 수동태\n• 형태/공식: 동사구: be p.p. + 전치사 / that절: It is said that S+V... <-> S + be said + to부정사\n• 개념설명: ① 동사구(look up to, run over, take care of, laugh at 등)는 전치사를 분리하거나 빠뜨리지 않고 한 덩어리로 유지하여 'be p.p. + 전치사 + by'가 됨. ② that절 수동태: It is believed that he is rich. = He is believed to be rich. (that절 시제가 주절보다 앞설 때는 완료부정사 to have p.p. 사용: He is said to have been rich).\n• 예문: He was laughed at by his classmates. (at 누락 주의) / The dog was run over by a car. / It is said that she lives in Rome. = She is said to live in Rome. / He is said to have won the prize.", "Unit 6. by 이외의 전치사를 쓰는 수동태 - 감정, 상태, 원인 등을 나타내는 관용적 수동태 표현\n• 형태/공식: be + p.p. + [in/at/with/about/of/to/for]\n• 개념설명: 행위자 by 대신 특정 의미를 지닌 전치사를 관용적으로 사용하는 표현: be interested in(~에 관심있다), be surprised at(~에 놀라다), be satisfied with(~에 만족하다), be covered with(~로 덮여있다), be filled with(~로 가득차다), be worried about(~에 대해 걱정하다), be known to(~에게 알려지다), be known for(~로 유명하다), be known as(~로서 알려지다), be made of(물리적 변화), be made from(화학적 변화), be tired of(~에 싫증나다), be pleased with(~에 기뻐하다).\n• 예문: The mountain is covered with snow. / He is known to everyone in town. / Cheese is made from milk. / Desks are made of wood. / She was surprised at the news."]}, "4": {"level": "GRADE 3", "chapter": 4, "title": "Chapter 4", "points": ["Unit 1. 명사적 용법과 가주어 가목적어 - 주어, 목적어, 보어 역할 및 it 가주어/가목적어, 의문사 + to v\n• 형태/공식: 가주어: It is ~ to v / 가목적어: S + V(find, make, think) + it + 형/명 + to v\n• 개념설명: ① to부정사가 주어로 쓰이면 단수 취급하며, 주어가 길어지면 가주어 It을 앞에 두고 진주어 to부정사는 뒤로 보냄. ② 5형식 문장에서 목적어로 to부정사가 오면 가목적어 it을 쓰고 목적격보어 뒤로 진목적어 to부정사를 보냄(make it a rule to v 등). ③ 의문사 + to부정사 = '의문사 + S + should + 동원'(why + to부정사는 존재하지 않음).\n• 예문: To learn English is interesting. = It is interesting to learn English. / I found it difficult to solve the problem. / I don't know what to do (= what I should do). / I don't know how to drive.", "Unit 2. 형용사적 용법과 be to 용법 - 명사 수식(전치사 수반) 및 be to 용법 5가지\n• 형태/공식: 명사 + to부정사 (전치사) / be + to부정사\n• 개념설명: ① 명사 수식: 명사 뒤에서 수식('something/anything/nothing + 형용사 + to부정사' 어순 주의). 부정사가 수식하는 명사가 전치사의 목적어일 경우 전치사를 반드시 써야 함(a chair to sit on, a house to live in, a pen to write with, someone to talk to). ② be to 용법: 예정(~할 예정이다), 의무(~해야 한다), 가능(~할 수 있다), 의도(~하고자 한다 주로 if절), 운명(~할 운명이다).\n• 예문: Give me something cold to drink. / I need a chair to sit on. (on 누락 주의) / We are to meet here at five. (예정) / You are to obey the rules. (의무) / If you are to succeed, work hard. (의도) / He was never to return home. (운명)", "Unit 3. 부사적 용법 - 목적, 감정의 원인, 판단의 근거, 결과, 형용사 수식\n• 형태/공식: 부사 역할(동사, 형용사, 부사, 문장 전체 수식)\n• 개념설명: ① 목적: '~하기 위해'(= in order to, so as to). ② 감정의 원인: 감정형용사(glad, sorry, pleased, happy 등) 뒤에서 '~해서'. ③ 판단 근거: must be, cannot be 뒤에서 '~하는 것을 보니'. ④ 결과: 살아서/자라서 ~가 되다(live to be, grow up to be), 결국 ~하게 되다(only to v, never to v). ⑤ 형용사 수식: '~하기에' 형용사를 한정(easy to read, dangerous to climb).\n• 예문: He studied hard to pass the exam (in order to pass). / I am glad to meet you. / He must be a genius to solve that puzzle. / She grew up to be a doctor. / He worked hard, only to fail. / English is easy to learn.", "Unit 4. 의미상의 주어, 시제, 수동태 - for/of 의미상의 주어, 완료부정사, 수동부정사\n• 형태/공식: for/of + 목적격 + to v / to have p.p. / to be p.p.\n• 개념설명: ① 의미상의 주어: 일반적인 경우 'for + 목적격', 사람의 인품·성격 형용사(kind, nice, foolish, polite, rude, wise, careless, generous 등) 뒤에서는 'of + 목적격'. ② 시제: 단순부정사(to v)는 본동사와 동일/미래 시제, 완료부정사(to have p.p.)는 본동사보다 이전 시제. ③ 수동태: to be p.p.(단순수동), to have been p.p.(완료수동).\n• 예문: It is important for you to be on time. / It was very kind of you to help me. / He seems to be rich. (현재 부자인 듯) vs He seems to have been rich. (과거에 부자였던 듯 = It seems that he was rich). / He wants to be loved by everyone.", "Unit 5. 원형부정사와 사역·지각동사 - 지각·사역동사의 목적격보어 원형부정사 및 수동 관계\n• 형태/공식: 사역/지각 + O + 동사원형 (단, 수동 관계일 땐 p.p.)\n• 개념설명: 사역동사(make, have, let)와 지각동사(see, hear, watch, feel 등)는 목적어와 목적격보어가 능동 관계일 때 동사원형을 씀(help는 원형 또는 to부정사 둘 다 가능). 단, 목적어와 목적격보어의 관계가 '수동'일 때는 사역동사/지각동사를 불문하고 반드시 과거분사(p.p.)를 써야 함(사역동사 let은 be p.p.).\n• 예문: She made him clean his room. / I heard someone call my name. / I had my hair cut. (내 머리는 잘려지는 수동 관계이므로 cut[p.p.]) / She had her watch stolen.", "Unit 6. 주요 구문 및 독립부정사 - too~to 구문, enough to 구문 및 독립부정사 관용구\n• 형태/공식: too~to v / 형·부 + enough to v / 독립부정사\n• 개념설명: ① too+형/부 + to v: 너무 ~해서 ...할 수 없다(= so+형/부 + that S cannot...). ② 형/부 + enough + to v: 충분히 ~해서 ...할 수 있다(= so+형/부 + that S can...). ③ 독립부정사: 문장 전체를 수식하는 독립된 관용 표현: to tell the truth(솔직히 말해서), so to speak(말하자면), to make matters worse(설상가상으로), strange to say(이상한 말이지만), not to mention(~은 말할 것도 없이), to begin with(우선).\n• 예문: He is too young to go to school. (= He is so young that he cannot go to school.) / He is rich enough to buy a car. (= He is so rich that he can buy a car.) / To tell the truth, I didn't like the food. / To make matters worse, it began to rain."]}, "5": {"level": "GRADE 3", "chapter": 5, "title": "Chapter 5", "points": ["Unit 1. 동명사의 기본 성격과 의미상의 주어, 시제, 수동태 - 명사 역할, 소유격/목적격 의미상의 주어, 완료/수동형\n• 형태/공식: v-ing / having p.p. / being p.p. / having been p.p.\n• 개념설명: ① 주어, 목적어, 보어로 쓰이며 주어로 쓰일 때 단수 취급, 부정은 not/never v-ing. ② 의미상의 주어: 원칙은 소유격(my, his), 구어체에서는 목적격(me, him)도 허용. ③ 시제: 단순동명사(v-ing)는 본동사와 동일 시제, 완료동명사(having p.p.)는 본동사보다 이전 시제. ④ 수동태: being p.p.(단순수동), having been p.p.(완료수동).\n• 예문: Collecting coins is my hobby. (단수 is) / I don't like his (him) talking loudly. / He is proud of having won the gold medal. (상을 탄 것이 과거) / She is afraid of being rejected.", "Unit 2. 목적어 동사 구분: 동명사 vs to부정사 - 동명사만 vs to부정사만 취하는 동사\n• 형태/공식: 동명사만 취하는 동사 vs to부정사만 취하는 동사\n• 개념설명: ① 동명사만을 목적어로 취하는 동사(주로 과거·회피·소극적 의미): enjoy, finish, avoid, mind, practice, give up, postpone(put off), admit, deny, quit, suggest, consider, escape 등(MEGAPASS). ② to부정사만을 목적어로 취하는 동사(주로 미래지향·의지 의미): want, hope, wish, expect, decide, plan, promise, refuse, agree, choose, manage, afford 등.\n• 예문: I enjoy reading books. (to read 불가) / Would you mind opening the window? / He promised to help me. (helping 불가) / She decided to study abroad.", "Unit 3. 목적어 동사 구분: 둘 다 취하는 동사 - 의미 변화 없는 동사 vs 의미가 달라지는 동사\n• 형태/공식: like, begin 등 (의미 동일) vs remember, forget, regret, try, stop (의미 다름)\n• 개념설명: ① 둘 다 취하며 의미 차이가 거의 없는 동사: like, love, hate, begin, start, continue, prefer 등. ② 둘 다 취하지만 의미가 달라지는 동사: remember/forget/regret + to v(미래에 ~할 것을 기억/잊다/유감스러워하다) vs + v-ing(과거에 ~했던 것을 기억/잊다/후회하다); try + to v(~하려고 애쓰다, 노력하다) vs try + v-ing(시험 삼아 한번 해보다); stop + to v(~하기 위해 멈추다, to부정사는 부사적 용법) vs stop + v-ing(~하던 것을 그만두다, 목적어).\n• 예문: Remember to lock the door. (잠글 것을) vs I remember locking the door. (잠갔던 것을) / I regret to say this. (말하게 되어 유감) vs I regret saying that. (말했던 것을 후회) / He stopped to smoke. (담배 피우기 위해 멈춤) vs He stopped smoking. (금연함)", "Unit 4. 동명사의 주요 관용 표현 (1) - cannot help -ing, feel like -ing, be worth -ing, prevent from -ing 등\n• 형태/공식: 관용적 동명사 표현 공식\n• 개념설명: ① cannot help -ing: ~하지 않을 수 없다 (= cannot but + 동원). ② feel like -ing: ~하고 싶다 (= would like to v). ③ be worth -ing: ~할 가치가 있다. ④ prevent/keep/stop/discourage/prohibit A from -ing: A가 ~하는 것을 막다/방해하다. ⑤ look forward to -ing: ~하기를 고대하다 (to는 전치사이므로 뒤에 동명사).\n• 예문: I cannot help laughing at his joke. (= I cannot but laugh...) / I feel like eating pizza tonight. / This book is worth reading twice. / Heavy rain prevented us from going on a picnic. / I am looking forward to seeing you soon.", "Unit 5. 동명사의 주요 관용 표현 (2) - be busy -ing, spend 시간 -ing, there is no -ing, It is no use -ing 등\n• 형태/공식: 관용적 동명사 표현 공식\n• 개념설명: ① be busy -ing: ~하느라 바쁘다. ② spend + 시간/돈 + (in) -ing: ~하는 데 시간/돈을 쓰다. ③ there is no -ing: ~하는 것은 불가능하다 (= It is impossible to v). ④ It is no use -ing: ~해도 소용없다 (= It is of no use to v). ⑤ On -ing: ~하자마자 (= As soon as S+V), In -ing: ~함에 있어서 (= When S+V). ⑥ make a point of -ing: ~하는 것을 규칙으로 삼다. ⑦ What about -ing / How about -ing: ~하는 게 어때?\n• 예문: She is busy preparing for the exam. / He spent two hours fixing his bike. / There is no denying the fact. (= It is impossible to deny...) / It is no use crying over spilt milk. / On hearing the news, she burst into tears."]}, "6": {"level": "GRADE 3", "chapter": 6, "title": "Chapter 6", "points": ["Unit 1. 분사의 개념 및 감정 유발/느낌 분사 - 현재분사(-ing) vs 과거분사(p.p.) 및 감정분사 원리\n• 형태/공식: 현재분사: 능동/진행 (~하는, ~하고 있는) vs 과거분사: 수동/완료 (~된, ~받은)\n• 개념설명: ① 현재분사는 능동·진행의 의미, 과거분사는 수동·완료의 의미를 가짐. 단독 수식은 명사 앞, 수식어구 동반은 명사 뒤에서 수식. ② 감정 분사: 감정을 '유발하는 원인(사물 등)'에는 현재분사(-ing), 감정을 '직접 느끼는 주체(주로 사람)'에는 과거분사(-ed)를 씀(interesting/interested, exciting/excited, surprising/surprised, tiring/tired, disappointing/disappointed, boring/bored 등).\n• 예문: a rolling stone / a broken window / The game was exciting, so the spectators were excited. / The news was shocking, and we were shocked at it.", "Unit 2. 분사의 보어 역할 - 주격보어 및 목적격보어로 쓰이는 분사\n• 형태/공식: 주격보어: S+V+C(분사) / 목적격보어: S+V+O+O.C(분사)\n• 개념설명: ① 주격보어: 주어의 상태나 동작을 서술함(sit, stand, lie, keep, remain 등 뒤). ② 목적격보어: 지각동사(see, hear 등)나 사역/유지동사(keep, leave, find, have) 뒤에서 목적어와 목적격보어가 능동 관계이면 현재분사(-ing), 수동 관계이면 과거분사(p.p.)를 씀.\n• 예문: He sat reading a book. / She kept me waiting for an hour. (내가 기다리는 능동이므로 waiting) / I heard my name called. (이름이 불려지는 수동이므로 called) / Keep the door locked. (문이 잠겨지는 수동이므로 locked)", "Unit 3. 분사구문의 기본 개념 및 전환 규칙 - 부사절의 분사구문 전환 단계 및 부정형\n• 형태/공식: 접속사 생략 -> 주어 생략 -> 동사 v-ing로 전환 (부정: not/never + v-ing)\n• 개념설명: ① 분사구문 전환 단계: 1단계: 부사절의 접속사 생략(의미를 명확히 할 때는 접속사를 남겨둘 수도 있음), 2단계: 부사절 주어가 주절 주어와 같으면 부사절 주어 생략, 3단계: 동사를 v-ing 형태로 전환. ② 부정문: 부사절의 부정어 not/never는 분사 바로 앞에 위치시킴(Not v-ing / Never v-ing).\n• 예문: When he saw the dog, he ran away. -> Seeing the dog, he ran away. / Because I didn't know his number, I couldn't call him. -> Not knowing his number, I couldn't call him.", "Unit 4. 완료형 및 수동형 분사구문 - having p.p. 및 (being/having been) p.p.\n• 형태/공식: 완료형: Having + p.p. / 수동형: (Being) p.p. 또는 (Having been) p.p.\n• 개념설명: ① 완료형 분사구문(Having p.p.): 부사절의 시제가 주절의 시제보다 한 시제 앞설 때 사용함. ② 수동형 분사구문: 수동태 부사절을 분사구문으로 바꿀 때 Being이나 Having been은 보통 생략되므로 과거분사(p.p.)만 단독으로 남아 시작함.\n• 예문: Because I had met him before, I recognized him at once. -> Having met him before, I recognized him at once. / As it was written in haste, the letter had some errors. -> (Being) Written in haste, the letter had some errors.", "Unit 5. with + 명사 + 분사 (부대상황) - 부대상황을 나타내는 with 구문\n• 형태/공식: with + 명사(대명사) + 분사 (현재분사 또는 과거분사)\n• 개념설명: 동시동작이나 부대상황을 나타내며 '~가 ...한 채로, ~하면서'로 해석함. 명사와 분사의 관계가 능동/진행이면 '현재분사(-ing)', 수동/완료이면 '과거분사(p.p.)'를 씀. 신체 부위가 대상일 때 접히거나 닫히거나 꼬이는 동작은 수동으로 취급하여 p.p.를 씀(with legs crossed, with arms folded, with eyes closed).\n• 예문: She was listening to music with her eyes closed. (눈이 감겨진 수동이므로 closed) / He sat with his legs crossed. (다리가 꼬아진 수동이므로 crossed) / She walked in the park with a dog following her. (개가 따라오는 능동이므로 following)", "Unit 6. 독립분사구문 및 관용 표현 - 독립분사구문과 무인칭 독립분사구문 관용 표현\n• 형태/공식: 주어 + v-ing (독립분사구문) / 관용구\n• 개념설명: ① 독립분사구문: 부사절의 주어와 주절의 주어가 다를 때, 부사절의 주어를 생략하지 않고 분사 앞에 그대로 남겨두는 구문(날씨·시간 비인칭 it 주의: It being fine, we went out). ② 무인칭 독립분사구문: 주어가 일반인일 때 주어를 밝히지 않고 관용적으로 굳어진 표현: generally speaking(일반적으로 말해서), strictly speaking(엄격히 말해서), frankly speaking(솔직히 말해서), judging from(~으로 판단하건대), speaking/talking of(~에 대해 말하자면), taking all things into consideration(모든 점을 고려할 때).\n• 예문: As the weather was nice, we went for a walk. -> The weather being nice, we went for a walk. / Strictly speaking, spiders are not insects. / Judging from his accent, he must be from Texas."]}, "7": {"level": "GRADE 3", "chapter": 7, "title": "Chapter 7", "points": ["Unit 1. 원급 비교 - 원급 비교의 형태 및 부정형\n• 형태/공식: as + 형용사/부사의 원급 + as / not as [so] + 원급 + as\n• 개념설명: 둘 사이의 성질이나 수량이 동등함을 나타냄. as와 as 사이에는 반드시 '원급'만 오며 비교급/최상급 불가. 부정형은 앞의 as 대신 so를 쓸 수 있으며(not as/so + 원급 + as), 'A는 B만큼 ~하지 않다'는 뜻으로 실질적으로 'B가 A보다 더 ~하다'라는 열등/우등 비교(B is ~er than A / A is less than B)를 의미함.\n• 예문: Tom is as tall as Jane. / She can run as fast as him. / This book is not as (so) interesting as that one. (= That book is more interesting than this one. / This book is less interesting than that one.)", "Unit 2. 비교급 비교 - 비교급 비교의 형태 및 비교급 수식·강조 부사\n• 형태/공식: 형용사/부사의 비교급 + than / [much, even, still, far, a lot] + 비교급\n• 개념설명: 두 대상을 비교하여 '더 ~한'을 나타냄. 비교급 뒤에는 비교 대상 앞에 than(~보다)을 씀. 비교급을 '훨씬'이라는 뜻으로 강조할 때는 much, even, still, far, a lot을 쓰며, 원급 수식 부자인 very, so, too는 비교급을 수식할 수 없음(very taller 불가). less + 원급 + than은 '~보다 덜 ~한'이라는 열등비교로 not as/so + 원급 + as로 전환 가능.\n• 예문: He is much taller than his brother. (very taller 불가) / Health is far more important than wealth. / This test is less difficult than the previous one. (= This test is not as difficult as the previous one.)", "Unit 3. 원급·비교급 주요 표현 - 배수사 비교, as ~ as possible, the 비교급 구문\n• 형태/공식: 배수사 + as + 원급 + as (= 배수사 + 비교급 + than) / as + 원급 + as possible (= as + 원급 + as + 주어 + can/could) / The + 비교급~, the + 비교급...\n• 개념설명: ① 배수사 비교: half, twice, three times 등 배수사는 as 앞 또는 비교급 앞에 위치함. ② as~ as possible: '가능한 한 ~하게'(= as + 원급 + as + 주어 + can/could, 시제 일치 주의). ③ 비교급 and 비교급 / more and more + 원급: '점점 더 ~한'. ④ The + 비교급~, the + 비교급...: '~하면 할수록 더 ...하다'(콤마 앞뒤로 the+비교급 어순 병렬, 접속사와 부사가 결합된 특수 구조).\n• 예문: This room is three times as large as mine. (= three times larger than mine) / Please call me as soon as possible. (= as soon as you can) / It is getting colder and colder. / The more you read, the wiser you become.", "Unit 4. 최상급 비교 - 최상급의 기본 형태 및 in / of 전치사 구별\n• 형태/공식: the + 최상급 + in + 단수(장소·집단) / of + 복수명사(동일 대상) 또는 기간\n• 개념설명: 셋 이상의 대상 중에서 '가장 ~한'을 나타냄. 원칙적으로 최상급 앞에는 정관사 the를 붙임(단, 부사의 최상급 앞 the는 생략 가능). 비교 범위를 나타내는 전치사 구분: ① in + 단수명사(장소, 단체, 범위를 나타내는 명사: in the world, in Korea, in our class), ② of + 복수명사(비교 대상 멤버: of all, of the four, of my friends) 또는 기간 명사. the + 최상급 + 명사 + (that) + 주어 + have ever p.p.: '지금까지 ~한 것 중 가장 ...한'.\n• 예문: Mount Everest is the highest mountain in the world. / He is the smartest of all the students. / This is the most exciting movie that I have ever watched. / She runs (the) fastest of the four.", "Unit 5. 원급·비교급을 이용한 최상급 표현 - 원급/비교급을 활용한 최상급 표현 4대 공식 및 주의사항\n• 형태/공식: ① 비교급 + than any other + 단수명사 / ② 비교급 + than all the other + 복수명사 / ③ No (other) + 단수명사 ~ as/so + 원급 + as / ④ No (other) + 단수명사 ~ 비교급 + than\n• 개념설명: 최상급의 의미를 원급이나 비교급 구조로 전환하는 표현: ① any other 뒤에는 반드시 '단수명사'가 옴. ② all the other 뒤에는 '복수명사'가 옴. ③ No other로 시작하는 부정주어 구문에서 주어 명사는 '단수명사'이며, 문장 동사는 긍정형을 씀(부정어 No가 이미 주어에 포함되어 있으므로 don't/doesn't 중복 불가). ④ one of the + 최상급 + 복수명사: '가장 ~한 것들 중 하나'(주어로 쓰일 때 전체 구문은 단수 동사로 받음).\n• 예문: Tom is taller than any other boy in his class. (any other boys 불가) / Tom is taller than all the other boys. / No other boy in his class is as tall as Tom. / No other boy in his class is taller than Tom. / One of the greatest scientists is Hawking. (is 단수)"]}, "8": {"level": "GRADE 3", "chapter": 8, "title": "Chapter 8", "points": ["Unit 1. 부사절 접속사 - 시간, 이유, 조건, 양보 부사절 및 시간·조건 부사절 시제 규칙\n• 형태/공식: 시간(when, while, as, since, until, before, after, as soon as) / 이유(because, since, as) / 조건(if, unless) / 양보(though, although, even though, even if)\n• 개념설명: ① 시간·조건의 부사절에서는 미래의 일이라도 미래시제(will) 대신 '현재시제'를 씀(주절은 미래시제 유지). ② unless는 'if~not'의 뜻이므로 unless 절 안에는 not을 중복하여 쓰지 않음(unless you don't 불가). ③ 양보 접속사(though, although 등 + 주어+동사) vs 전치사(despite, in spite of + 명사/동명사구) 구별. ④ as long as: '~하는 한'(조건), as soon as: '~하자마자'(시간).\n• 예문: I will call you when I arrive home. (when I will arrive 불가) / Unless you hurry, you will miss the train. (Unless you don't hurry 불가) / Although it rained heavily, we went out. / In spite of the heavy rain, we went out. (전치사 뒤 명사)", "Unit 2. 명사절 접속사 that 및 특수 구문 - 명사절 that, 동격 that, so ~ that 구문\n• 형태/공식: 명사절 that + 완전한 문장 / 명사(fact, news, idea) + that(동격) + 완전한 문장 / so + 형/부 + that S + V / such + (a/an) + 형 + 명 + that S + V\n• 개념설명: ① 접속사 that이 이끄는 절은 문장 안에서 주어, 목적어, 보어 역할을 하며 뒤에 완전한 문장이 옴. 목적어절 that은 생략 가능하나 주어·보어절 that은 생략하지 않음. 주어로 쓰일 때 가주어 It을 자주 씀. ② 동격 that: the fact, news, idea, thought, belief, rumor 등 추상명사 뒤에서 구체적 내용을 보충하며 생략 불가. ③ so + 형/부 + that ~ = such + a/an + 형 + 명 + that ~(너무 ~해서 ...하다). ④ so that + S + can: '~하기 위해'(= in order that = in order to v). ⑤ It seems that S + V = S + seem(s) + to v.\n• 예문: I know that he is honest. (that 생략 가능) / The news that he won the prize surprised us. (동격 that 생략 불가) / He was so tired that he could not walk. (= He was too tired to walk.) / It was such a nice day that we went on a picnic. / It seems that she is rich. = She seems to be rich.", "Unit 3. 간접의문문 - 의문사 유무에 따른 간접의문문 어순 및 생각/추측동사 의문사 전치\n• 형태/공식: ① 의문사 있는 경우: 의문사 + S + V (단, 의문사가 주어면: 의문사 + V) / ② 의문사 없는 경우: if/whether + S + V (or not) / ③ think류: 의문사 + do you think/believe/guess/suppose + S + V?\n• 개념설명: ① 의문문이 다른 문장의 일부분(명사절)으로 들어갈 때 평서문 어순(의문사 + 주어 + 동사)으로 바뀜. 의문사가 문장의 주어 역할을 할 때는 어순 변경 없이 '의문사 + 동사' 유지. ② 의문사가 없는 의문문은 'if/whether(~인지 아닌지) + 주어 + 동사'를 씀. or not은 whether 바로 뒤에 올 수 있으나(whether or not S+V), if 바로 뒤에는 붙일 수 없음(if or not 불가, 문장 끝은 가능). if절은 목적어 역할만 가능, whether절은 주어 목적어 보어 모두 가능. 간접의문문 내부의 미래 사실은 will 사용. ③ 주절 동사가 think, believe, suppose, guess, imagine 등 생각·추측 동사일 때는 의문사가 문장 맨 앞으로 이동함.\n• 예문: Do you know who she is? (who is she 불가) / I wonder what happened. (what이 주어) / I don't know whether he will come or not. (if or not he will come 불가) / Who do you think will win the game? (Do you think who... 불가) / Where do you think he lives?", "Unit 4. 상관접속사 및 접속부사 - 상관접속사의 수 일치 원칙과 주요 접속부사\n• 형태/공식: both A and B / not A but B / not only A but also B (= B as well as A) / either A or B / neither A nor B\n• 개념설명: ① both A and B는 항상 '복수 취급'. ② not A but B(A가 아니라 B), either A or B(A 또는 B), neither A nor B(A도 B도 아닌), not only A but also B(A뿐만 아니라 B도)는 모두 동사와 가까운 'B'에 동사의 수를 일치시킴. 단, not only A but also B는 'B as well as A'로 전환되므로 이때는 앞에 위치한 'B'에 수일치함. ③ 접속부사(however, therefore, moreover, furthermore, in addition, for example, instead, on the other hand, in fact, finally)는 접속사가 아닌 '부사'이므로 두 절을 콤마(,)만으로 직접 연결할 수 없으며, 마침표(.)나 세미콜론(;) 뒤에 독립적으로 쓰임.\n• 예문: Both Tom and Jerry are smart. (항상 복수) / Not only you but also he is responsible. (= He as well as you is responsible. is 단수) / Neither he nor they were invited. (they에 맞춰 were) / Either you or I am wrong. (I에 맞춰 am) / It rained heavily; therefore, the game was canceled. (콤마만으로 연결 불가)"]}, "9": {"level": "GRADE 3", "chapter": 9, "title": "Chapter 9", "points": ["Unit 1. 관계대명사의 기본 역할과 격변화 - 주격, 목적격, 소유격 관계대명사의 역할 및 선행사 수 일치\n• 형태/공식: 주격: who/which/that + V / 목적격: whom(who) / which / that + S + V / 소유격: whose + 무관사 명사 + V / S + V\n• 개념설명: 관계대명사는 '접속사 + 대명사' 역할을 하며 선행사를 수식하는 형용사절을 이끎. ① 주격 관계대명사 바로 뒤에는 동사가 오며, 이 동사의 수는 반드시 '선행사'의 인칭과 수에 일치시킴. ② 목적격 관계대명사는 타동사나 전치사의 목적어 역할을 하며 생략 가능. ③ 소유격 관계대명사 whose는 사물·사람 선행사 모두에 쓰이며, 뒤에 관사(a/an/the)가 없는 완전한 형태의 명사가 바로 이어짐.\n• 예문: I know a boy who speaks four languages. (boy에 맞춰 speaks) / I bought the books which were on sale. (books에 맞춰 were) / The girl whom (who) I met yesterday was Jane. / I met a boy whose father is an astronaut. / Look at the house whose roof is red.", "Unit 2. 관계대명사 what 및 that의 특별 용법 - 관계대명사 what vs that/which 구분 및 what의 문법적 특성\n• 형태/공식: what = the thing(s) which/that (~하는 것) / 선행사 포함 관계대명사\n• 개념설명: ① 관계대명사 what은 선행사를 자체에 포함하므로 앞에 수식받는 선행사 명사가 절대 올 수 없음('명사 + what' 형태는 문법 오류). what이 이끄는 절은 명사절로서 문장의 주어, 목적어, 보어로 쓰이며, 주어로 쓰일 때 원칙적으로 단수 취급함. ② 관계대명사 that vs 접속사 that: 관계대명사 that은 앞에 선행사 명사가 있고 뒤가 불완전한 문장이며 소유격이 없음. 접속사 that은 앞에 선행사가 없고 뒤가 완전한 문장임. ③ 관계대명사 that만을 주로 쓰는 선행사: the only, the very, the same, 최상급, 서수, all, every, no, -thing(something/anything/nothing) 등이 포함된 선행사.\n• 예문: What he said is true. (what절 주어는 단수 is) / Show me what you have in your pocket. / This is the thing that I wanted. (= This is what I wanted.) / This is the only book that explains the rule. / I know that he is kind. (접속사 that: 뒤 완전)", "Unit 3. 주의해야 할 관계대명사 - 관계대명사의 생략, 전치사 + 관계대명사, 계속적 용법\n• 형태/공식: 생략: 목적격 관계대명사 / 주격 관계대명사 + be동사 / 전치사 + whom/which / 계속적 용법: , + who/which\n• 개념설명: ① 생략: 타동사의 목적격 관계대명사는 단독 생략 가능. '주격 관계대명사 + be동사'는 한 묶음으로 동시 생략 가능(주격만 단독 생략 불가). ② 전치사 + 관계대명사: 전치사가 관계대명사 바로 앞에 위치할 때는 반드시 목적격인 whom 또는 which만 가능하며, that이나 who는 전치사 바로 뒤에 올 수 없음(to that, with who 불가). 또한 전치사 바로 뒤의 관계대명사는 생략 불가. ③ 계속적 용법: 콤마(,) 뒤에 쓰여 선행사나 앞 절 전체를 부연 설명함('접속사 + 대명사'로 전환 가능). 관계대명사 that과 what은 계속적 용법으로 쓸 수 없음(, that 불가). 계속적 용법의 관계대명사는 생략 불가. which는 앞 문장 전체나 일부를 선행사로 받을 수 있음.\n• 예문: The movie (which) I saw was boring. / The girl (who was) playing the piano is Sally. / The house in which he lives is old. (in that 불가, in 생략 불가) / He gave me a watch, which didn't work. (= and it didn't work) / He said he was rich, which was a lie. (앞 문장 전체 수식)", "Unit 4. 관계부사 - 관계부사의 종류, 전치사+관계대명사 전환 및 the way how 동시 사용 금지\n• 형태/공식: 시간(when = at/on/in which) / 장소(where = at/in/on which) / 이유(why = for which) / 방법(how = in which)\n• 개념설명: ① 관계부사는 '접속사 + 부사' 역할을 하며 뒤에 필수 문장 성분을 모두 갖춘 '완전한 문장'이 옴(관계대명사 뒤는 불완전한 문장). ② 선행사나 관계부사 둘 중 하나를 생략할 수 있음(the time when -> the time 또는 when). ③ ★방법의 the way와 how는 절대로 나란히 함께 쓸 수 없으며 반드시 'the way' 단독 또는 'how' 단독으로만 써야 함(the way how는 절대 불가, the way in which나 the way that은 가능). ④ 계속적 용법: 콤마 뒤에는 when과 where만 사용 가능(why, how는 계속적 용법 없음).\n• 예문: I remember the day when (on which) we first met. / This is the place where he was born. / Tell me the reason why you were late. / This is the way I solved the puzzle. (This is the way how... 절대 불가) / This is how I solved the puzzle. / I went to Paris, where I stayed for a week. (= and there)", "Unit 5. 복합관계사 - 복합관계대명사, 복합관계형용사, 복합관계부사의 어순 및 쓰임\n• 형태/공식: whoever, whichever, whatever / whatever/whichever + 명사 / whenever, wherever, however + 형/부+S+V\n• 개념설명: 관계대명사나 관계부사에 -ever가 붙은 형태. 자체에 선행사를 포함함. ① 복합관계대명사: 1) 명사절(~하는 사람은 누구나/어느 것이나/무엇이나 = anyone who, anything that, 주어 시 단수 취급), 2) 양보 부사절(누가/어느 것을/무엇을 ~할지라도 = no matter who/which/what). ② 복합관계형용사: whatever/whichever + 명사(어떤~라도, 어떤~을 하더라도). ③ 복합관계부사: whenever(시간 부사절: ~할 때는 언제나 = at any time when / 양보: 언제 ~하더라도 = no matter when), wherever(장소: ~하는 곳은 어디나 = at any place where / 양보: 어디서 ~하더라도 = no matter where), however(오직 양보 부사절만 가능: 아무리 ~할지라도 = no matter how, ★어순 주의: however + 형용사/부사 + 주어 + 동사).\n• 예문: Whoever breaks the rule will be punished. (= Anyone who breaks...) / Whatever you do, do your best. (= No matter what you do) / You can take whichever seat you want. (복합관계형용사) / You may leave whenever you want. (= at any time when) / However hard it may be, I will do it. (however + 형/부+S+V)"]}, "10": {"level": "GRADE 3", "chapter": 10, "title": "Chapter 10", "points": ["Unit 1. 가정법 과거 & 가정법 과거완료 - 가정법 과거와 과거완료의 기본 공식 및 직설법 시제 전환\n• 형태/공식: 가정법 과거: If + S + 과거동사(be는 were), S + would/could/might + 동원 / 가정법 과거완료: If + S + had p.p., S + would/could/might + have p.p.\n• 개념설명: ① 가정법 과거: '현재 사실'의 반대나 실현 불가능한 일을 가정('만약 ~라면...할 텐데'). if절의 be동사는 주어 인칭에 상관없이 were를 쓰는 것이 원칙(구어체 was 허용). 직설법 전환 시 'As + 주어 + 현재시제(반대 긍정/부정)'로 바뀜. ② 가정법 과거완료: '과거 사실'의 반대나 일어나지 않은 일을 가정('만약 ~했더라면...했었을 텐데'). 직설법 전환 시 'As + 주어 + 과거시제(반대 긍정/부정)'로 바뀜.\n• 예문: If I were rich, I could buy the car. (직설법: As I am not rich, I cannot buy the car.) / If she had studied hard, she would have passed the exam. (직설법: As she didn't study hard, she didn't pass the exam.)", "Unit 2. 혼합가정법 - 혼합가정법의 구조, 기준 시점 및 직설법 전환\n• 형태/공식: If + S + had + p.p. (과거 사건), S + would/could/might + 동사원형 (현재 결과, now/today)\n• 개념설명: 과거에 ~했더라면(과거 사실의 반대: had p.p.), 지금 ...할 텐데(현재 사실의 반대: 조동사 과거+동원)를 나타냄. if절은 가정법 과거완료(had p.p.)이고, 주절은 가정법 과거(조동사 과거형 + 동사원형)의 형태가 결합된 혼합 구조임. 주절에 now, today, at present 등 '현재'를 가리키는 부사(구)가 흔히 동반됨. 직설법 전환 시 if절은 '과거 시제(As + S + 과거동사)', 주절은 '현재 시제(S + 현재동사)'로 각각 변환됨.\n• 예문: If I had taken your advice then, I would be happy now. (직설법: As I didn't take your advice then, I am not happy now.) / If he had not missed the plane, he would be in Paris now.", "Unit 3. I wish & as if 가정법 - I wish 및 as if 가정법의 시제 기준과 직설법 전환 원리\n• 형태/공식: I wish + S + 과거동사/had p.p. // as if + S + 과거동사/had p.p.\n• 개념설명: ① I wish 가정법: 실현하기 어려운 소망/유감 표현. 1) I wish + S + 과거동사: 현재 사실에 대한 반대 소망('~라면 좋을 텐데' = I'm sorry that + S + 현재동사 반대). 2) I wish + S + had p.p.: 과거 사실에 대한 후회/소망('~했더라면 좋았을 텐데' = I'm sorry that + S + 과거동사 반대). ② as if (as though) 가정법: 마치 ~인/였던 것처럼. 1) as if + S + 과거동사: '주절의 동사와 동일한 시점'의 사실 반대 가정(In fact, S + 주절과 동일시제 동사). 2) as if + S + had p.p.: '주절의 동사보다 한 시제 더 앞선 시점'의 사실 반대 가정(In fact, S + 주절보다 이전시제 동사).\n• 예문: I wish I were taller. (= I'm sorry that I am not taller.) / I wish I had met him yesterday. (= I'm sorry that I didn't meet him yesterday.) / He talks as if he knew everything. (In fact, he doesn't know everything.) / She looks as if she had seen a ghost. (In fact, she didn't see a ghost).", "Unit 4. 주의해야 할 가정법 - Without/But for 구문 및 if 생략에 의한 도치\n• 형태/공식: Without/But for + 명사(구) // Were / Had + S~ (if 생략 도치)\n• 개념설명: ① Without/But for + 명사: '~이 없다면/없었더라면'. 1) 가정법 과거: If it were not for = Were it not for = Without = But for ~. 2) 가정법 과거완료: If it had not been for = Had it not been for = Without = But for ~. 뒤따르는 주절의 조동사 형태(would+동원 vs would have p.p.)를 보고 과거인지 과거완료인지 판별함. ② if 생략 도치: 조건절의 접속사 if가 생략되면 주어와 동사가 도치됨. If I were -> Were I, If S had p.p. -> Had S p.p., If S should v -> Should S v. 일반과거동사는 if 생략 시 도치하지 않으며 were, had, should가 있을 때만 가능함.\n• 예문: Without water, no living thing could exist. (= If it were not for water = Were it not for water) / But for your help, I would have failed. (= If it had not been for your help = Had it not been for your help) / Were I in your place, I would accept it. (If I were...) / Had I known the truth, I would have told you. (If I had known...)"]}, "11": {"level": "GRADE 3", "chapter": 11, "title": "Chapter 11", "points": ["Unit 1. 수 일치 - 주어 형태에 따른 단수·복수 취급 규칙 및 부분·전체 표현 수 일치\n• 형태/공식: 단수 취급 주어 vs 복수 취급 주어 vs 부분사 of 명사\n• 개념설명: ① 단수 취급: each/every + 단수명사, -one/-body/-thing 대명사, 학문명(-s로 끝나도: mathematics, physics, economics, politics), 국가명(the United States, the Netherlands), 시간·금액·거리·무게의 하나의 단위(Ten dollars is..., Five miles is...), 동명사구/to부정사구/명사절 주어, the number of + 복수명사('~의 수'-> 단수 동사). ② 복수 취급: the + 형용사('~한 사람들' = 형용사 + people), a number of + 복수명사('많은~'-> 복수 동사), both A and B. ③ 부분/전체 표현: all, most, some, any, half, the rest, 분수, percent + of + 명사 -> 'of 뒤에 오는 명사의 수'에 동사를 일치시킴(명사가 단수/셀수없으면 단수동사, 복수면 복수동사).\n• 예문: Every student has a book. (단수) / Mathematics is my favorite subject. (단수 is) / Three years is a long time. (단수 is) / The number of students is increasing. (단수 is) vs A number of students are absent. (복수 are) / The rich are not always happy. (복수 are) / Half of the apples are rotten. vs Half of the apple is rotten.", "Unit 2. 시제 일치 및 예외 - 주절과 종속절의 시제 일치 원칙과 불변의 예외 규정\n• 형태/공식: 주절 현재 -> 종속절 모든 시제 / 주절 과거 -> 종속절 과거 또는 과거완료(had p.p.)\n• 개념설명: ① 기본 원칙: 주절의 동사가 현재시제(현재, 현재완료, 미래)일 때 종속절에는 의미에 따라 모든 시제가 올 수 있음. 주절의 동사가 과거시제로 바뀌면 종속절의 현재는 '과거'로, 과거 및 현재완료는 '과거완료(had p.p.)'로 바뀜. ② 시제 일치의 예외: 1) 항상 현재시제를 쓰는 경우: 불변의 진리, 과학적 사실, 현재의 일반적 사실 및 지속적 습관, 격언·속담(주절이 과거여도 종속절은 무조건 현재시제). 2) 항상 과거시제를 쓰는 경우: 역사적 사실(주절이 과거완료를 요구하더라도 무조건 단순과거 시제).\n• 예문: I think that he is honest. -> I thought that he was honest. / I thought that he had been sick. / The teacher said that the earth goes around the sun. (과학적 사실: goes 현재) / He said that he gets up early every day. (현재의 습관: gets 현재) / We learned that World War II ended in 1945. (역사적 사실: had ended 불가, ended 과거)", "Unit 3. 평서문의 화법 전환 - 평서문의 직접화법에서 간접화법 전환 규칙(전달동사, 시제, 인칭, 지시사·부사)\n• 형태/공식: say -> say, say to -> tell + 목적어 + that절\n• 개념설명: ① 전달동사 변경: say -> say, say to -> tell + 목적어 (tell 뒤 전치사 to 금지). ② 콤마(,)와 따옴표(\" \")를 없애고 접속사 that으로 연결(that 생략 가능). ③ 인칭대명사는 주절의 주어와 목적어 입장에 맞추어 전환. ④ 주절의 전달동사가 과거형이면 인용부호 안의 동사 시제를 한 시제 과거로 후퇴시킴(현재->과거, 과거/현재완료->과거완료). ⑤ 지시대명사 및 시간·장소 부사 전환: this -> that, these -> those, here -> there, now -> then, today -> that day, yesterday -> the day before (the previous day), tomorrow -> the next (following) day, ago -> before, come -> go.\n• 예문: He said to me, \"I like this book.\" -> He told me that he liked that book. / She said, \"I met Tom yesterday.\" -> She said that she had met Tom the day before. / Tom said, \"I will come here tomorrow.\" -> Tom said that he would go there the next day.", "Unit 4. 의문문 및 명령문의 화법 전환 - 의문문(의문사 유/무) 및 명령문의 간접화법 전환 규칙\n• 형태/공식: 의문문: say (to) -> ask (+ 목적어) + 의문사 / if/whether + S + V / 명령문: say (to) -> tell/order/advise + O + (not) to v\n• 개념설명: ① 의문사 있는 의문문: say (to) -> ask, 어순은 평서문 어순인 '의문사 + 주어 + 동사'로 전환. 의문사가 주어면 '의문사 + 동사' 그대로 유지. 시제와 인칭 일치 적용. ② 의문사 없는 의문문: say (to) -> ask, 접속사 'if 또는 whether(~인지 아닌지) + 주어 + 동사' 어순으로 전환. ③ 명령문: say (to)를 전달 내용의 성격에 따라 tell(일반적 전달), order(명령), advise(충고), ask(부탁)로 바꾸고, '목적어 + to부정사' 형태로 전환함. 부정명령문(Don't~)은 목적격보어 앞에 not을 붙여 '목적어 + not to부정사'로 전환함(to not 불가).\n• 예문: He said to me, \"Where do you live?\" -> He asked me where I lived. / She said to him, \"Do you love me?\" -> She asked him if (whether) he loved her. / Mom said to me, \"Clean your room.\" -> Mom told me to clean my room. / The doctor said to him, \"Don't smoke.\" -> The doctor advised him not to smoke. (not to v 어순 주의)"]}, "12": {"level": "GRADE 3", "chapter": 12, "title": "Chapter 12", "points": ["Unit 1. 강조 - 일반동사 강조 do 및 It is ~ that 강조 구문(가주어-진주어 구별)\n• 형태/공식: do / does / did + 동사원형 // It is/was + 강조 대상(주어/목적어/부사구) + that...\n• 개념설명: ① 동사 강조: 일반동사의 시제와 주어 인칭에 맞추어 do, does, did를 본동사 앞에 쓰고 본동사는 '동사원형'으로 환원함('정말로, 진짜로'로 해석). be동사나 조동사는 do로 강조하지 않음. ② It is ~ that 강조 구문: 주어, 목적어, 부사(구/절)를 강조할 수 있으며 동사나 보어는 강조 불가. 강조 대상이 사람이면 who/whom, 사물이면 which, 시간이면 when, 장소면 where로 that 대신 전환 가능. 주어를 강조할 경우 that 뒤에 오는 동사의 수는 강조된 주어에 일치시킴. 과거 사실은 It was ~ that을 씀. ③ It is ~ that 강조 구문 vs 가주어-진주어 구문 구별: It is와 that을 지웠을 때 문장 성분이 온전하게 하나로 합쳐져 완전한 문장이 성립하면 '강조 구문', It is와 that을 지웠을 때 문장이 성립하지 않고 형용사/분사 등이 붕 뜨면 '가주어-진주어 구문'.\n• 예문: I did see the ghost with my own eyes. (saw -> did see) / It was Tom that (who) broke the window yesterday. (Tom 강조) / It was yesterday that (when) Tom broke the window. (yesterday 강조) / It was in the park that I met her. (부사구 강조) / It is true that he is rich. (true는 형용사이므로 가주어-진주어)", "Unit 2. 도치 - 장소·방향 부사구 도치, 부정어 도치 및 so/neither 도치\n• 형태/공식: 부사구 + 동사 + 주어 / 부정어 + 조동사/do/be + 주어 + 본동사 / So/Neither + 동사 + 주어\n• 개념설명: ① 장소·방향 부사구 도치: 장소 부사구가 문두로 강조되어 나갈 때 '부사구 + 동사 + 주어'로 도치됨. 단, 주어가 '대명사(he, she, it, they 등)'일 때는 절대로 도치하지 않고 '부사구 + 대명사 주어 + 동사' 어순을 유지함(Down came it 불가 -> Down it came). ② 부정어 도치: never, little, hardly, scarcely, seldom, rarely, neither, nor, not only, only + 부사구 등이 문두로 나가면 의문문 어순으로 도치됨(부정어 + do/does/did/be/조동사/have + 주어 + 동사원형/분사). ③ so / neither 도치: 앞 문장의 내용에 동의할 때 긍정문은 'So + 동사 + 주어'(~도 또한 그렇다), 부정문은 'Neither (Nor) + 동사 + 주어'(~도 또한 아니다)로 도치함(동사는 앞 문장의 동사 종류인 be/일반/조동사에 일치).\n• 예문: Under the tree sat an old man. (명사 주어 도치) / Here comes the bus. vs Here it comes. (대명사 주어는 도치 안됨) / Never did I dream that I would win. (Never I dreamed 불가) / Little did she know the truth. / A: I am tired. - B: So am I. / A: I don't like coffee. - B: Neither do I.", "Unit 3. 부정 - 전체 부정 vs 부분 부정을 비롯한 개념과 구분\n• 형태/공식: all / every / always / both / completely + not (부분 부정) vs no / none / neither / never (전체 부정)\n• 개념설명: ① 부분 부정: 전체를 나타내는 말(all, every, both, always, completely, entirely, necessarily 등)과 부정어(not)가 함께 쓰이면 '모두(항상) ~인 것은 아니다(일부는 그렇고 일부는 아니다)'라는 부분 부정을 나타냄. ② 전체 부정: no, none, neither, never, nothing, nobody 등이 쓰이면 '어느 것도(아무도) ~아니다'라는 완전한 전체 부정을 나타냄. ③ neither of + 복수명사: 둘 다 아니다(단수 취급 원칙), none of + 명사: 셋 이상 중 아무도 아니다(of 뒤 명사에 따라 단수/복수 취급).\n• 예문: Not all students passed the exam. (모든 학생이 합격한 것은 아니다 - 부분 부정) / None of the students passed the exam. (아무도 합격하지 못했다 - 전체 부정) / I don't know both of them. (둘 다 아는 것은 아니다 - 한명만 앎) / I know neither of them. (둘 다 모른다 - 전체 부정) / The rich are not always happy. (항상 행복한 것은 아니다)", "Unit 4. 생략과 동격 - 문맥상 반복 생략, 부사절의 주어+be동사 생략 및 동격의 3가지 표현\n• 형태/공식: 반복 생략 / 접속사 + (S + be) + 분사/형용사 / 동격(콤마, of, that절)\n• 개념설명: ① 문맥상 반복 어구 생략: 중복되는 주어나 동사, to부정사의 반복되는 동사구(대부정사 to만 남김: You may go if you want to). ② 부사절의 생략: 시간·조건·양보의 부사절에서 '주어 + be동사'는 '주절의 주어와 일치할 때' 통째로 생략 가능(When (he was) young,...). ③ 동격 표현 3가지: 1) 명사, 명사 (콤마 동격): Mr. Kim, our English teacher, ... 2) 명사 + of + 동명사/명사 (전치사 of 동격): the city of Seoul, the hope of winning. 3) 추상명사 + that절 (동격 that절): the news, fact, idea, rumor, promise, thought + that + 완전한 문장(동격 that은 생략 불가).\n• 예문: You may come if you want to (come). (대부정사) / While (she was) walking in the street, she met Jan
