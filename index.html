사를 쓰지 않고 'by bus', 'by subway'로 표현합니다."}, {"level": "GRADE 1", "chapter": 5, "type": "객관식", "question": "bed, school, church 등의 장소 명사가 본래의 고유한 목적으로 쓰일 때 관사 사용 규칙은?", "options": ["반드시 정관사 the를 쓴다", "반드시 부정관사 a를 쓴다", "관사를 생략한다", "대문자로 시작한다"], "answer": "3", "explanation": "잠자러 가다(go to bed), 공부하러 등교하다(go to school), 예배하러 가다(go to church)처럼 본래 목적일 때는 관사를 쓰지 않습니다."}, {"level": "GRADE 1", "chapter": 5, "type": "객관식", "question": "세상에 오직 하나뿐인 유일물 중 모음 발음으로 시작하는 earth(지구) 앞의 정관사 'the'의 올바른 발음은?", "options": ["[ðə] (\"더\")", "[ði] (\"디\")", "[ðeɪ] (\"데이\")", "묵음(발음하지 않음)"], "answer": "2", "explanation": "the 뒤에 오는 명사가 모음 발음으로 시작하면 정관사 the는 '더'가 아닌 '디[ði]'로 발음합니다."}, {"level": "GRADE 1", "chapter": 5, "type": "OX", "question": "명사 앞에 형용사가 같이 올 때(예: easy book, red apple), 부정관사 a와 an의 선택은 뒤따르는 '형용사의 첫 발음'을 기준으로 결정한다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "a와 an의 선택은 바로 뒤에 이어지는 단어의 첫 발음에 맞추므로 'an easy book', 'a red apple'이 올바릅니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "인칭대명사의 격 변화에서 사물/동물을 가리키는 대명사 'it'이 가지고 있지 않은 형태는?", "options": ["주격", "목적격", "소유격", "소유대명사"], "answer": "4", "explanation": "it은 주격(it), 소유격(its), 목적격(it)은 존재하지만 소유대명사(~의 것) 형태는 존재하지 않습니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "대명사 'its'와 축약형 'it's'의 문법적 구분에 대한 설명으로 가장 올바른 것은?", "options": ["its는 it is의 줄임말이고, it's는 it의 소유격이다.", "its는 it의 소유격(~의)이고, it's는 it is의 줄임말이다.", "둘 다 줄임말이며 상호 교환이 가능하다.", "둘 다 소유격을 나타내는 복수 표기이다."], "answer": "2", "explanation": "its는 it의 소유격(그것의)이며 아포스트로피가 붙은 it's는 'it is' 또는 'it has'의 축약형입니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "-s로 끝나는 규칙 복수명사(boys, girls 등)의 소유격을 만드는 올바른 표기법은?", "options": ["명사 뒤에 's를 붙인다 (boys's)", "명사 뒤에 아포스트로피(')만 붙인다 (boys')", "명사 앞에 of를 반드시 쓴다", "명사 뒤에 -es를 다시 붙인다 (boyses)"], "answer": "2", "explanation": "이미 -s로 끝난 복수명사의 소유격은 뒤에 아포스트로피(')만 붙여 boys', girls' 등으로 표기합니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "한 문장에서 주어와 목적어가 동일한 대상일 때 목적어 자리에 쓰는 대명사의 명칭은?", "options": ["지시대명사", "부정대명사", "재귀대명사", "소유대명사"], "answer": "3", "explanation": "주어가 한 동작의 대상(목적어)이 자기 자신일 때 목적어 자리에 재귀대명사(-self/-selves)를 씁니다."}, {"level": "GRADE 1", "chapter": 6, "type": "OX", "question": "주어나 목적어의 의미를 직접 강조하기 위해 덧붙여진 재귀대명사의 '강조 용법'은 생략해도 문장이 완전하다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "강조 용법은 이미 완전한 문장 요소 뒤에 강조를 위해 덧붙인 것이므로 생략해도 문법적으로 문제가 없습니다."}, {"level": "GRADE 1", "chapter": 6, "type": "OX", "question": "주어와 목적어가 같아서 목적어 자리에 위치한 재귀대명사의 '재귀 용법'은 문장의 필수 요소이므로 생략할 수 없다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "재귀 용법은 동사나 전치사의 목적어(필수 성분) 역할을 하므로 문장에서 생략할 수 없습니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "3인칭 복수 대명사 'they'의 올바른 재귀대명사 형태는?", "options": ["theirself", "theirselves", "themself", "themselves"], "answer": "4", "explanation": "they의 재귀대명사는 복수 어미 -selves를 결합한 themselves입니다 (theirself, themself는 비표준)."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "재귀대명사 관용 표현 중 '다른 사람 없이 혼자서, 스스로(=alone)'라는 의미를 나타내는 것은?", "options": ["of oneself", "by oneself", "in itself", "for oneself"], "answer": "2", "explanation": "[by + 재귀대명사]는 '혼자서, 다른 사람의 도움 없이'라는 의미의 대표적인 관용 표현입니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "재귀대명사 관용 표현 'enjoy oneself'의 올바른 의미는?", "options": ["스스로를 반성하다", "즐거운 시간을 보내다", "혼자서 밥을 먹다", "스스로를 자랑하다"], "answer": "2", "explanation": "[enjoy + 재귀대명사]는 '즐거운 시간을 보내다(=have a good time)'라는 뜻의 관용 표현입니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "재귀대명사 관용 표현 'help yourself (to~)'의 올바른 의미는?", "options": ["스스로 청소하세요", "마음껏 드세요", "음식을 만들지 마세요", "스스로 도와주세요"], "answer": "2", "explanation": "'Help yourself (to~)'는 상대방에게 '~을 마음껏 드세요'라고 권하는 생활 관용 표현입니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "가까이 있는 대상(사람/사물)을 가리키는 지시대명사의 단수형과 복수형이 올바르게 짝지어진 것은?", "options": ["that - those", "this - these", "this - those", "that - these"], "answer": "2", "explanation": 수 있다."], "answer": "2", "explanation": "some은 주로 긍정문(또는 권유문)에 쓰이고, any는 부정문, 의문문, 조건문에 쓰입니다."}, {"level": "GRADE 1", "chapter": 6, "type": "객관식", "question": "의문문이지만 상대방에게 음식을 권유하거나 'Yes'라는 긍정의 대답을 기대할 때 사용하는 부정대명사는?", "options": ["any", "lone", "some", "no"], "answer": "3", "explanation": "\"Would you like some tea?\" 처럼 권유하거나 긍정의 대답을 기대할 때는 의문문이어도 some을 씁니다."}, {"level": "GRADE 1", "chapter": 6, "type": "OX", "question": "부정대명사 some과 any는 단독으로 대명사로 쓰일 뿐만 아니라, 명사 앞에서 '약간의, 몇몇의'라는 의미로 명사를 수식하는 형용사로도 쓰일 수 있다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "some과 any는 대명사뿐만 아니라 명사를 수식하는 형용사(한정사)로도 사용됩니다."}, {"level": "GRADE 1", "chapter": 7, "type": "객관식", "question": "2형식 문장의 문장 구조로 알맞은 것은?", "options": ["주어 + 동사", "주어 + 동사 + 목적어", "주어 + 동사 + 주격보어", "주어 + 동사 + 목적어 + 주격보어"], "answer": "3", "explanation": "2형식은 '주어 + 동사 + 주격보어(S+V+C)'로 이루어집니다."}, {"level": "GRADE 1", "chapter": 7, "type": "객관식", "question": "감각동사(look, sound, smell, taste, feel) 뒤에 보어로 올 수 있는 품사는?", "options": ["부사 (-ly)", "형용사", "접속사", "전치사"], "answer": "2", "explanation": "감각동사 뒤에는 주격보어로 형용사만 올 수 있으며 부사는 올 수 없습니다."}, {"level": "GRADE 1", "chapter": 7, "type": "객관식", "question": "감각동사(taste, smell 등) 뒤에 주격보어로 올 수 있는 올바른 단어의 형태는?", "options": ["형용사 원형", "to부정사", "부사", "명사 단독"], "answer": "1", "explanation": "감각동사 뒤에는 주격보어로 반드시 형용사가 와야 하며, 부사는 올 수 없습니다."}, {"level": "GRADE 1", "chapter": 7, "type": "OX", "question": "감각동사 뒤에 명사가 올 때는 전치사 like를 붙여 [감각동사 + like + 명사] 형태로 쓴다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "감각동사 뒤에 명사를 쓸 때는 전치사 like를 붙여 'look like~' 등으로 표현합니다."}, {"level": "GRADE 1", "chapter": 7, "type": "객관식", "question": "감각동사(look, smell 등) 뒤에 형용사가 아닌 명사를 보어로 연결할 때 사용하는 필수 전치사는?", "options": ["for", "with", "like", "to"], "answer": "3", "explanation": "명사 앞이므로 감각동사 뒤에 like를 붙여 [감각동사 + like + 명사] 형태로 씁니다."}, {"level": "GRADE 1", "chapter": 7, "type": "OX", "question": "감각동사(sound, look 등) 뒤에는 주격보어로 부사(-ly)를 사용할 수 있다.", "options": ["O", "X", "N/ nswer": "2", "explanation": "[명령문, or~]는 '~해라, 그렇지 않으면 ...할 것이다'라는 의미를 나타냅니다."}, {"level": "GRADE 1", "chapter": 12, "type": "OX", "question": "등위접속사 and, but, or로 연결되는 단어나 구는 문법적 형태가 동일해야 한다(병렬 구조).", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "등위접속사는 대등한 관계를 연결하므로 문법적 형태를 일치(병렬 구조)시켜야 합니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "앞 절이 원인이고 뒤 절이 결과를 나타낼 때 두 절을 연결하는 알맞은 접속사는?", "options": ["but", "so", "or", "because"], "answer": "2", "explanation": "so는 '그래서, 그러므로'라는 뜻으로 앞의 원인과 뒤의 결과를 자연스럽게 이어줍니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "앞 절의 원인에 따른 결과를 이어주며 '그래서, 그러므로'를 뜻하는 등위접속사는?", "options": ["but", "so", "or", "because"], "answer": "2", "explanation": "so는 앞의 원인에 따른 결과를 이어주는 등위접속사로 '그래서'를 뜻합니다."}, {"level": "GRADE 1", "chapter": 12, "type": "OX", "question": "한 문장에서 이유를 나타내는 종속접속사 because와 등위접속사 so를 함께 나란히 연결하여 쓸 수 없다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "한 문장에서 종속접속사 because와 등위접속사 so를 함께 겹쳐 쓸 수 없습니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "'~할 때'라는 뜻으로 시간 부사절을 이끄는 접속사는?", "options": ["when", "because", "so", "if"], "answer": "1", "explanation": "when은 '~할 때'라는 뜻으로 때나 시점을 나타내는 시간 부사절을 이끕니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "시간 부사절을 이끄는 접속사 'before'와 'after'의 의미 연결이 바른 것은?", "options": ["before: ~한 후에, after: ~하기 전에", "before: ~하기 전에, after: ~한 후에", "before: ~할 때까지, after: ~하는 동안", "before: ~때문에, after: ~라면"], "answer": "2", "explanation": "before는 '~하기 전에', after는 '~한 후에'라는 의미를 갖습니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "시간이나 조건의 부사절에서는 미래의 일을 어떤 시제로 나타내는가?", "options": ["과거시제", "현재시제", "미래시제 (will)", "과거완료시제"], "answer": "2", "explanation": "시간이나 조건을 나타내는 부사절에서는 미래의 일이라도 will 대신 현재시제로 표현합니다."}, {"level": "GRADE 1", "chapter": 12, "type": "OX", "question": "when이 이끄는 시간 부사절 안에서는 내일의 일(미래)이더라도 will 대신 현재시제를 써야 한다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "when이 이끄는 시간 부사절에서는 미래 시제 대신 현재 시제를 써야 합니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "'만약 ~한다면'이라는 조건을 나타내는 접속사는?", "options": ["though", "because", "if", "until"], "answer": "3", "explanation": "if는 조건을 나타내는 종속접속사로 '만약 ~한다면'의 뜻을 갖습니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "조건 부사절 if절 안에서 주어가 3인칭 단수이고 미래의 조건을 나타낼 때 동사의 올바른 형태는?", "options": ["동사원형", "3인칭 단수 현재형(-(e)s)", "will + 동사원형", "동사의 과거형"], "answer": "2", "explanation": "조건 부사절에서는 미래시제 대신 현재시제를 사용하므로 3인칭 단수 주어에 맞춰 -(e)s를 씁니다."}, {"level": "GRADE 1", "chapter": 12, "type": "OX", "question": "'if not'의 의미를 한 단어로 나타내는 접속사는 'unless'이다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "unless는 '만약 ~하지 않는다면(=if~not)'을 뜻하는 조건 접속사입니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "'because'와 'because of'의 문법적 쓰임 차이로 알맞은 것은?", "options": ["because 뒤에는 명사(구), because of 뒤에는 [주어+동사] 절이 온다.", "because 뒤에는 [주어+동사] 절, because of 뒤에는 명사(구)가 온다.", "둘 다 [주어+동사] 절만 올 수 있다.", "둘 다 명사만 올 수 있다."], "answer": "2", "explanation": "접속사 because 뒤에는 [주어+동사]의 절이 오고, 전치사 because of 뒤에는 명사(구)가 옵니다."}, {"level": "GRADE 1", "chapter": 12, "type": "OX", "question": "접속사 because 뒤에는 명사(구)만 단독으로 올 수 있다.", "options": ["O", "X", "N/A", "N/A"], "answer": "X", "explanation": "명사(구) 앞에는 전치사 because of를 써야 하며, 접속사 because 뒤에는 [주어+동사] 절이 와야 합니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "명사절 접속사 that이 이끄는 절이 문장에서 할 수 없는 역할은?", "options": ["주어 역할", "목적어 역할", "보어 역할", "부사 역할"], "answer": "4", "explanation": "명사절 that절은 명사처럼 문장에서 주어, 타동사의 목적어, 보어 역할을 수행합니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "명사절을 이끄는 접속사 that을 생략할 수 있는 경우는?", "options": ["주어로 쓰일 때", "타동사의 목적어로 쓰일 때", "보어로 쓰일 때", "어떤 경우에도 생략 불가"], "answer": "2", "explanation": "think, know, believe 등 타동사의 목적어 역할을 하는 명사절 접속사 that은 생략할 수 있습니다."}, {"level": "GRADE 1", "chapter": 12, "type": "OX", "question": "명사절 that절이 문장의 주어로 쓰일 때는 보통 가주어 it을 문두에 두고 that절을 뒤로 보낼 수 있다.", "options": ["O", "X", "N/A", "N/A"], "answer": "O", "explanation": "주어로 쓰인 that절이 길 경우 가주어 it을 앞에 두고 that절을 문장 뒤로 보내는 It [is... that...] 구문을 씁니다."}, {"level": "GRADE 1", "chapter": 12, "type": "객관식", "question": "접속사의 쓰임 및 문법 규칙에 대한 설명 중 옳지 않은 것은?", "options": ["등위접속사로 연결되는 요소는 문법적으로 대등한 병렬 구조여야 한다.", "타동사의 목적어로 쓰인 명사절 접속사 that은 생략할 수 있다.", "조건 부사절 if절 안에서는 미래의 일이라도 현재시제로 나타낸다.", "시간이나 조건의 부사절 안에서는 항상 미래시제(will)를 써야 한다."], "answer": "4", "explanation": "시간이나 조건의 부사절에서는 미래의 일이라도 will을 쓰지 않고 현재시제로 대신 표현합니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "2형식 문장의 기본 구성 성분으로 올바른 것은?", "options": ["주어 + 동사", "주어 + 동사 + 주격보어", "주어 + 동사 + 목적어", "주어 + 동사 + 간접목적어 + 직접목적어"], "answer": "2", "explanation": "2형식 문장은 '주어 + 동사 + 주격보어(S+V+C)'로 구성됩니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "2형식 문장에서 주격보어로 올 수 없는 품사는?", "options": ["명사", "형용사", "부사", "대명사"], "answer": "3", "explanation": "주격보어로는 주어를 보충 설명하는 명사나 형용사만 올 수 있으며, 부사는 보어로 쓰일 수 없습니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "2형식 감각동사(look, smell, sound, taste, feel) 바로 뒤에 올 수 있는 보어 형태는?", "options": ["부사", "형용사", "동사원형", "전치사구"], "answer": "2", "explanation": "감각동사 뒤에는 우리말로 부사처럼 해석되더라도 반드시 '형용사' 보어를 써야 합니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "감각동사 뒤에 보어로 명사를 연결하고자 할 때 반드시 동사 뒤에 붙여야 하는 전치사는?", "options": ["for", "of", "like", "with"], "answer": "3", "explanation": "감각동사 뒤에 명사가 올 때는 「감각동사 + like + 명사」의 형태를 취합니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "다음 중 '~한 상태가 되다'라는 상태 변화를 나타내는 2형식 동사군에 속하지 않는 것은?", "options": ["become", "get", "stay", "turn"], "answer": "3", "explanation": "stay는 상태 유지를 나타내는 동사이며, become, get, turn, grow 등은 상태 변화를 나타내는 동사입니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "4형식 문장의 목적어 배열 순서로 올바른 것은?", "options": ["주어 + 동사 + 직접목적어(~을/를) + 간접목적어(~에게)", "주어 + 동사 + 간접목적어(~에게) + 직접목적어(~을/를)", "주어 + 동사 + 목적어 + 보어", "주어 + 동사 + 부사구"], "answer": et은 능동 관계의 목적격보어로 동사원형을 취합니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "준사역동사 'help'가 5형식에서 목적격보어로 취할 수 있는 형태로 올바른 것은?", "options": ["동사원형만 가능", "to부정사만 가능", "동사원형과 to부정사 둘 다 가능", "현재분사(v-ing)만 가능"], "answer": "3", "explanation": "help는 목적격보어로 동사원형과 to부정사를 모두 취할 수 있습니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "5형식 지각동사(see, hear, feel 등)의 목적어와 목적격보어가 능동 관계일 때 보어로 올 수 있는 두 가지 형태는?", "options": ["to부정사, 동명사", "동사원형, 현재분사(v-ing)", "to부정사, 과거분사(p.p.)", "동명사, 과거분사(p.p.)"], "answer": "2", "explanation": "지각동사의 목적격보어로는 동작의 진행을 강조할 때 현재분사(-ing)를 쓰고, 일반적인 동작에는 동사원형을 씁니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "다음 중 5형식 지각동사의 목적격보어로 절대 올 수 없는 형태는?", "options": ["동사원형", "현재분사(v-ing)", "to부정사", "과거분사(p.p.)"], "answer": "3", "explanation": "지각동사는 목적격보어로 to부정사를 절대 취할 수 없습니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "준사역동사로 분류되며 목적격보어로 'to부정사'를 취하는 동사는?", "options": ["have", "let", "make", "get"], "answer": "4", "explanation": "get은 사역(~하게 시키다)의 의미를 갖지만 5형식 능동 관계에서 목적격보어로 to부정사를 취합니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "4형식 문장을 3형식으로 바꿀 때 간접목적어 앞에 전치사 'for'를 쓰는 동사가 아닌 것은?", "options": ["buy", "cook", "send", "make"], "answer": "3", "explanation": "send는 3형식 전환 시 간접목적어 앞에 전치사 to를 사용합니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "2형식에서 '~한 상태를 유지하다'의 의미를 갖는 대표적인 동사는?", "options": ["become", "turn", "keep", "get"], "answer": "3", "explanation": "keep, remain, stay 등은 상태 유지를 나타내는 2형식 동사입니다."}, {"level": "GRADE 2", "chapter": 1, "type": "객관식", "question": "다음 중 목적격보어로 to부정사를 취하는 '조언/허락/요구' 범주의 5형식 동사가 아닌 것은?", "options": ["advise", "allow", "order", "make"], "answer": "4", "explanation": "make는 사역동사이므로 목적격보어로 to부정사가 아닌 동사원형을 취합니다."}, {"level": "GRADE 2", "chapter": 2, "type": "객관식", "question": "현재시제를 반드시 사용해야 하는 상황에 해당하지 않는 것은?", "options": ["현재의 반복적인 습관", "역사적으로 일어난 과거의 사건", "불변의 진리 및 과학적 사실", "격언 및 속담"], "answer": "2", "explanation": 는 과거에 일어난 일을, to부정사는 미래에 해야 할 일을 의미합니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "'forget + to부정사' 구문이 나타내는 의미는?", "options": ["과거에 이미 했던 일을 잊어버리다", "(앞으로) 해야 할 일을 잊어버리다", "시험 삼아 ~해 보다", "~하는 것을 그만두다"], "answer": "2", "explanation": "forget to-v는 앞으로 해야 할 일을 깜빡하고 잊어버린 것을 의미합니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "'try + 동명사(-ing)' 구문의 올바른 문법적 의미는?", "options": ["~하려고 애쓰다, 노력하다", "시험 삼아 한번 ~해 보다", "~하는 것을 포기하다", "~하기를 거부하다"], "answer": "2", "explanation": "try -ing는 '시험 삼아 한번 해보다'이며, try to-v는 '~하려고 노력하다, 애쓰다'입니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "stop 뒤에 '동명사(-ing)'가 올 때와 'to부정사'가 올 때의 구조적 차이로 올바른 것은?", "options": ["-ing는 목적어(~하는 것을 멈추다) / to-v는 부사적 용법(~하기 위해 멈추다)", "stop to부정사는 취할 수 없다", "-ing는 부사 / to-v는 목적어", "둘 다 동사의 목적어"], "answer": "1", "explanation": "stop은 3형식 타동사로서 동명사 목적어를 취하며, stop to-v의 to부정사는 '목적(~하기 위해)'을 나타내는 부사적 용법입니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "관용표현 'look forward to' 뒤에 와야 하는 올바른 형태는?", "options": ["동사원형", "동명사(v-ing) 또는 명사", "to부정사", "과거분사"], "answer": "2", "explanation": "look forward to에서 to는 전치사이므로 뒤에 동명사(-ing)나 명사가 와야 합니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "「spend + 시간/돈 + (in) + 동사」 구문에서 동사의 올바른 형태는?", "options": ["to부정사", "동명사(v-ing)", "과거분사", "동사원형"], "answer": "2", "explanation": "'spend + 시간/돈 + -ing'는 '~하는 데 시간이나 돈을 쓰다'라는 대표적 동명사 관용표현입니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "'~하지 않을 수 없다'를 나타내는 동명사 관용표현으로 올바른 것은?", "options": ["cannot help + v-ing", "cannot help but + v-ing", "cannot afford + v-ing", "cannot without + v-ing"], "answer": "1", "explanation": "cannot help -ing는 '~하지 않을 수 없다'의 뜻입니다 (cannot help but 뒤에는 동사원형)."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "'~하느라 바쁘다'를 뜻하는 관용표현 「be busy」 뒤에 결합하는 형태는?", "options": ["to부정사", "동명사(v-ing)", "동사원형", "과거분사"], "answer": "2", "explanation": "be busy -ing '~하느라 바쁘다'는 동명사 관용구입니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "'~하고 싶다'라는 의미를 갖는 관용표현 'feel like' 뒤에 연결되는 형태는?", "options": ["동사원형", "동명사(v-ing)", "to부정사", "원형부정사"], "answer": "2", "explanation": "feel like -ing는 '~하고 싶다(=want to-v)'라는 동명사 관용표현입니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "제안을 나타내는 「How about ~ 」 또는 「What about ~ 」 뒤에 오는 동사의 형태는?", "options": ["동사원형", "동명사(v-ing)", "to부정사", "과거분사"], "answer": "2", "explanation": "about이 전치사이므로 뒤에는 동명사(-ing)가 옵니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "'~하는 데 어려움을 겪다'를 나타내는 표현 「have trouble (in) ~」의 형태는?", "options": ["동명사(v-ing)", "to부정사", "과거분사", "동사원형"], "answer": "1", "explanation": "have trouble (difficulty, a hard time) (in) -ing는 '~하는 데 어려움을 겪다'입니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "go skiing, go shopping처럼 취미나 레저 활동을 나타낼 때 쓰는 동명사 구문은?", "options": ["go to -ing", "go with -ing", "go -ing", "go for -ing"], "answer": "3", "explanation": "go + -ing '~하러 가다'라는 관용구입니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "동명사의 의미상 주어를 원칙적으로 나타내는 격(case)은?", "options": ["주격 또는 주격보어", "소유격 (구어체에서는 목적격도 허용)", "전치사 of + 소유대명사", "전치사 for + 목적격"], "answer": "2", "explanation": "동명사의 의미상 주어는 원칙적으로 '소유격'으로 쓰며, 구어체에서는 목적격도 허용됩니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "명사 앞의 -ing가 '용도나 목적'을 나타내어 복합명사를 이룰 때 이 -ing 동사는? (예: a sleeping bag)", "options": ["현재분사", "동명사", "과거분사", "접속사"], "answer": "2", "explanation": "sleeping bag(잠자기 위한 가방), waiting room(대기를 위한 방)처럼 '용도/목적'을 나타내면 동명사입니다."}, {"level": "GRADE 2", "chapter": 5, "type": "객관식", "question": "문장의 주어로 오는 동명사구의 수 일치 원칙은?", "options": ["뒤따르는 목적어의 수에 일치시킨다", "항상 3인칭 단수 동사로 받는다", "항상 복수 동사로 받는다", "주격보어의 형태에 일치시킨다"], "answer": "2", "explanation": "동명사구가 주어로 쓰일 때는 항상 단수 취급하여 단수 동사를 씁니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "동작을 직접 행하는 주어 중심의 능동태와 달리, 동작의 대상을 주어로 하여 '동작을 받거나 당함'을 나타내는 문법적 태는?", "options": ["명령형", "수동태", "가정태", "완료태"], "answer": "2", "explanation": "주어가 동작의 대상이 되어 '~을 받다, 당하다, 되다'를 나타내는 구문을 수동태라고 합니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "수동태의 기본 구성 형태와 행위자를 나타내는 형태는?", "options": ["be동사 + 현재분사 + with + 행위자", "be동사 + 과거분사(p.p.) + by + 행위자", "have + 과거분사 + by + 행위자", "do + 과거분사 + of + 행위자"], "answer": "2", "explanation": "수동태는 「be동사 + 과거분사(p.p.) + by + 행위자」의 기본 형태를 갖습니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "수동태 문장에 반드시 존재해야 수동태 구문으로 전환이 가능한 문장 성분은?", "options": ["주격보어", "목적어", "부사구", "간접보어"], "answer": "2", "explanation": "수동태는 능동태의 목적어를 주어로 이동하는 구조이므로, 목적어를 가진 3,4,5형식 문장(타동사)만 수동태가 가능합니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "다음 중 목적어를 취하지 않는 완전자동사로서 수동태가 절대 불가능한 동사는?", "options": ["happen", "make", "break", "write"], "answer": "1", "explanation": "happen, occur, appear, disappear 등 자동사는 목적어가 없으므로 수동태를 만들 수 없습니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "타동사임에도 불구하고 상태나 소유를 나타내어 원칙적으로 수동태로 쓰지 않는 동사는?", "options": ["clean", "invent", "resemble", "build"], "answer": "3", "explanation": "resemble(~와 닮다), have(가지다), lack(부족하다) 등 상태나 소유의 타동사는 수동태로 쓰이지 않습니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "주어가 3인칭 단수일 때 현재시제 수동태의 동사 형태는?", "options": ["is + 과거분사", "has + 과거분사", "are + 과거분사", "did + 과거분사"], "answer": "1", "explanation": "3인칭 단수 주어의 현재시제 수동태는 is + 과거분사(p.p.)입니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "과거시제 수동태의 올바른 공식은?", "options": ["had + 과거분사", "was/were + 과거분사", "would + 과거분사", "will been + 과거분사"], "answer": "2", "explanation": "과거시제 수동태는 「was/were + 과거분사(p.p.)」로 나타냅니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "조동사 will을 사용한 미래시제 수동태의 형태는?", "options": ["will be + 과거분사", "will being + 과거분사", "will + 과거분사", "조동사 + being + 과거분사"], "answer": "1", "explanation": "미래시제 수동태는 「will be + 과거분사(p.p.)」입니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "can, must 등 조동사가 포함된 수동태의 올바른 어순 형 worried about '~에 대해 걱정하다'입니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "be known 뒤에 \"자격이나 신분(~로서)\"이 올 때 사용하는 전치사는?", "options": ["for", "as", "to", "with"], "answer": "2", "explanation": "be known as '~로서 알려지다', be known for '~로 유명하다', be known to '~에게 알려지다'입니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "be known 뒤에 \"유명한 원인/이유(~때문에 유명하다)\"가 올 때 사용하는 전치사는?", "options": ["for", "as", "to", "by"], "answer": "1", "explanation": "be known for '~로 유명하다(유명한 이유)'를 나타냅니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "재료의 형태나 성질이 물리적으로 유지되는 경우 쓰는 표현은? (예: 책상이 나무로 만들어짐)", "options": ["be made of", "be made from", "be made with", "be made into"], "answer": "1", "explanation": "형태가 유지되는 물리적 변화에는 be made of를 쓰고, 화학적 변화(원료 형태 상실)에는 be made from을 씁니다."}, {"level": "GRADE 2", "chapter": 6, "type": "객관식", "question": "목적어가 2개인 4형식 문장(간접목적어, 직접목적어)의 수동태에 관한 설명으로 올바른 것은?", "options": ["항상 1개의 수동태 문장만 만들 수 있다.", "원칙적으로 두 목적어를 각각 주어로 하여 2개의 수동태 문장이 가능하다.", "간접목적어는 절대 주어가 될 수 없다.", "직접목적어는 절대 주어가 될 수 없다."], "answer": "2", "explanation": "4형식은 목적어가 2개이므로 간접목적어와 직접목적어를 각각 주어로 하는 2개의 수동태가 가능합니다(단, 동사에 따라 제한 있음)."}, {"level": "GRADE 2", "chapter": 7, "type": "객관식", "question": "영어의 분사(Participle) 두 종류와 각각의 기본 형태는?", "options": ["현재분사(v-ing), 과거분사(p.p.)", "동명사(v-ing), to부정사(to-v)", "원형부정사, 복합분사", "to부정사, 과거분사(p.p.)"], "answer": "1", "explanation": "분사는 현재분사(동사원형+-ing)와 과거분사(동사원형+-ed 또는 불규칙 형태) 두 가지가 있습니다."}, {"level": "GRADE 2", "chapter": 7, "type": "객관식", "question": "현재분사(v-ing)가 갖는 두 가지 핵심 문법적 의미는?", "options": ["능동, 진행", "수동, 완료", "미래, 예정", "원인, 결과"], "answer": "1", "explanation": "현재분사는 '~하고 있는(진행)'과 '~하는(능동)'의 의미를 갖습니다."}, {"level": "GRADE 2", "chapter": 7, "type": "객관식", "question": "과거분사(p.p.)가 갖는 두 가지 핵심 문법적 의미는?", "options": ["능동, 진행", "수동, 완료", "의무, 금지", "가정, 양보"], "answer": "2", "explanation": "과거분사는 '~해진, 당한(수동)'과 '이미 끝난(완료)'의 의미를 갖습니다."}, {"level": "GRADE 2", "chapter": 7, "type": "객관식", "question": "분사가 단독으로 ter": 7, "type": "객관식", "question": "분사구문에서 의미를 분명하게 전달하기 위해 접속사를 생략하지 않고 남겨둘 때의 형태는?", "options": ["접속사 + 주어 + v-ing", "v-ing + 접속사", "to + 접속사 + 동원", "접속사 + v-ing"], "answer": "4", "explanation": "의미를 확실히 전달하기 위해 접속사를 생략하지 않고 「접속사 + v-ing」 형태로 둘 수 있습니다."}, {"level": "GRADE 2", "chapter": 7, "type": "객관식", "question": "5형식 지각동사 구문에서 목적어와 목적격보어의 관계가 '수동'일 때 목적격보어로 쓰는 형태는?", "options": ["to부정사", "현재분사 (v-ing)", "동사원형", "과거분사 (p.p.)"], "answer": "4", "explanation": "지각동사나 사역동사라도 목적어와 목적격보어가 수동 관계일 때는 목적격보어로 과거분사(p.p.)를 씁니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "앞에서 언급된 명사와 '동일한 종류의 불특정 사물/사람'을 가리키는 대명사와 '바로 그 동일물'을 가리키는 대명사는?", "options": ["one / it", "another / this", "it / one", "other / that"], "answer": "1", "explanation": "종류는 같지만 불특정한 것은 one(복수는 ones), 앞에서 말한 바로 그 특정 사물은 it으로 받습니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "대상이 정확히 둘일 때, 하나는 'one', 나머지 하나는 무엇으로 나타내는가?", "options": ["another", "the other", "others", "the others"], "answer": "2", "explanation": "둘 중 하나는 one, 정해진 범위의 나머지 하나는 정관사 the가 붙은 the other로 씁니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "대상이 정확히 셋일 때, '첫 번째 하나, 또 다른 하나, 마지막 나머지 하나'를 가리키는 대명사의 순서는?", "options": ["some, another, others", "one, other, another", "one, another, the other", "another, the other, one"], "answer": "3", "explanation": "셋을 나열할 때는 「one(하나), another(또 다른 하나), the other(나머지 하나)」의 순서를 씁니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "부정대명사 'another'의 어원적 구성과 문법적 수(number) 취급으로 올바른 것은?", "options": ["an + other (단수 취급)", "any + other (단수/복수 무관)", "and + other (복수 취급)", "at + other (복수 취급)"], "answer": "1", "explanation": "another는 부정관사 an + other가 결합한 단어이므로 뒤에 단수명사가 오며 단수 취급합니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "정해지지 않은 다수 중에서 \"어떤 사람들은 ~, 다른 사람들은 ~\"을 나타낼 때 쓰는 짝표현은?", "options": ["one, the other", "some, others", "some, the others", "each, every"], "answer": "2", "explanation": "정해지지 않은 범위에서 일부는 some, 다른 일부는 others로 나타냅니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "한정된 범위의 집단 전체에서 \"일부는 ~, 나머지 전부다는 ~\"을 나타낼 때 쓰는 짝표현은?", "options": ["others, some", "all, both", "one, another", "some, the others"], "answer": "4", "explanation": "범위가 정해져 있어 나머지 전부를 가리킬 때는 정관사 the가 붙은 the others입니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "부정대명사/형용사 'each(각각)'의 결합 명사 및 동사의 수 일치 규칙은?", "options": ["복수명사 + 복수동사", "복수명사 + 단수동사", "셀 수 없는 명사 + 복수동사", "단수명사 + 단수동사"], "answer": "4", "explanation": "each는 개별성을 나타내므로 뒤에 단수 가산명사가 오고, 주어로 쓰일 때 단수동사로 받습니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "every(모든)에 관한 문법적 특징 중 올바른 것은?", "options": ["항상 복수명사와 결합한다.", "형용사로만 쓰이며 단독 대명사로 쓸 수 없다.", "대명사로만 쓰이며 형용사로는 쓰이지 않는다.", "복수동사로 취급한다."], "answer": "2", "explanation": "every는 오직 '형용사'로만 쓰여 단수명사를 수식하며(단독 주어로 불가), 단수 취급합니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "부정대명사 'all'이 주어로 쓰일 때의 수 일치 원칙으로 올바른 것은?", "options": ["언제나 무조건 복수동사로 받는다.", "언제나 무조건 단수동사로 받는다.", "사람이나 복수명사를 가리키면 복수, 사물 전체나 셀 수 없는 명사를 가리키면 단수", "목적격 보어에 일치시킨다."], "answer": "3", "explanation": "all은 수식하거나 지칭하는 대상이 복수면 복수 취급, 셀 수 없는 명사나 사물 전체(상황)이면 단수 취급합니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "both(둘 다)의 문법적 수 취급으로 올바른 것은?", "options": ["항상 단수 취급", "항상 복수 취급", "명사에 따라 결정", "동사에 따라 결정"], "answer": "2", "explanation": "both는 '둘 다'를 의미하므로 언제나 복수 취급합니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "something, anything, nothing, everyone 등 부정대명사가 주어일 때 동사의 수 일치는?", "options": ["복수 취급", "단수 취급", "1인칭 취급", "2인칭 취급"], "answer": "2", "explanation": "-thing, -one, -body로 끝나는 부정대명사는 문장의 주어로 쓰일 때 항상 단수 취급합니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "재귀대명사의 단수 및 복수형 어미 형태로 올바른 것은?", "options": ["단수 -selves, 복수 -self", "단수 -own, 복수 -owns", "단수 -body, 복수 -bodies", "단수 -self, 복수 -selves"], "answer": "4", "explanation": "재귀대명사는 단수형에 -self(myself, yourself, himself), 복수형에 -selves(ourselves, themselves)를 붙입니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "재귀대명사의 '재귀 용법'에 대한 설명으로 올바른 것은?", "options": ["주어와 목적어가 같을 때 목적어 자리에 쓰이며, 생략할 수 없다.", "항상 문장의 맨 앞에 위치한다.", "주어를 강조하기 위해 쓰이며, 생략할 수 있다.", "전치사 뒤에는 절대 쓸 수 없다."], "answer": "1", "explanation": "재귀 용법은 동작이 주어 자신에게 미칠 때 목적어로 쓰이는 것이므로 문장의 필수 성분이라 생략할 수 없습니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "재귀대명사의 '강조 용법'에 대한 설명으로 올바른 것은?", "options": ["주어나 목적어의 의미를 '직접/스스로'로 강조하며, 생략해도 문장이 성립한다.", "타동사 바로 뒤에만 올 수 있다.", "문장의 필수 목적어이므로 생략하면 비문이 된다.", "3인칭에만 사용할 수 있다."], "answer": "1", "explanation": "강조 용법은 주어, 목적어, 보어를 강조하기 위해 덧붙인 것이므로 생략해도 문장 구조에 영향이 없습니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "관용표현 'by oneself'가 갖는 의미는?", "options": ["혼자 힘으로 (스스로)", "혼자서 (alone)", "저절로", "제정신이 아닌"], "answer": "2", "explanation": "'by oneself'는 다른 사람 없이(alone)라는 뜻입니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "관용표현 'for oneself'가 갖는 의미는?", "options": ["남을 위하여", "혼자 힘으로, 스스로", "저절로", "저절로"], "answer": "2", "explanation": "'for oneself'는 남의 도움 없이 '혼자 힘으로, 스스로'라는 뜻입니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "관용표현 'enjoy oneself'의 올바른 한국어 의미는?", "options": ["스스로를 칭찬하다", "즐거운 시간을 보내다", "혼자 밥을 먹다", "자신을 자랑하다"], "answer": "2", "explanation": "enjoy oneself는 '즐겁게 보내다, 즐기다(=have a good time)'의 뜻입니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "관용표현 'help oneself to + 음식'의 의미는?", "options": ["음식을 치우다", "음식을 마음껏 먹다", "음식을 요리하다", "음식을 권하다"], "answer": "2", "explanation": "help oneself to는 '~을 마음껏 집어 먹다'라는 숙어입니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "관용표현 'talk to oneself'의 올바른 의미는?", "options": ["친구와 통화하다", "혼잣말하다", "남에게 이야기하다", "침묵하다"], "answer": "2", "explanation": "talk to oneself는 '혼잣말을 하다'입니다."}, {"level": "GRADE 2", "chapter": 8, "type": "객관식", "question": "재귀대명사(myself, himself 등)를 문장의 단독 '주어' 자리에 쓸 수 없는 이유는?", "options": ["복수형태가 없기 때문에", "주격을 나타내는 대명사가 아니기 때문에", "부정문에만 쓰이기 때문에", "항상 과거시제에만 쓰이기 때문에"], "answer": "2", "explanation": "재귀대명사는 목적어나 강조 부사구로만 쓰이며, 단독으로 문장의 주어가 될 수 없습니다 (주어는 he 등 주격을 씀)."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "원급 비교의 기본 형태와 부정형의 구조로 올바른 것은?", "options": ["as + 원급 + as / not as[so] + 원급 + as", "more + 원급 + than / not so + 원급 + as", "as + 비교급 + as / so + 원급 + that", "more + 원급 + that"], "answer": "1", "explanation": "원급 비교는 「as + 원급 + as」이며, 부정형은 앞에 not을 붙여 「not as[so] + 원급 + as」로 씁니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "'A가 B보다 더 ~하다'를 나타내는 우등 비교급의 기본 공식은?", "options": ["비교급 + B", "비교급 + than + B", "as + 비교급 + than + B", "more + 원급 + as + B"], "answer": "2", "explanation": "비교급 비교는 「비교급 + than」의 구조를 갖습니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "비교급 앞에서 '훨씬'의 의미로 비교급을 강조할 수 있는 부사 5가지에 해당하지 않는 것은?", "options": ["much, even, still, far, a lot", "very, so", "even", "still"], "answer": "2", "explanation": "very는 원급만을 수식할 수 있으며, 비교급을 수식할 수 없습니다. 비교급 강조 부사는 much, even, still, far, a lot입니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "셋 이상의 대상 중 가장 ~한'을 나타내는 최상급의 기본 형태는?", "options": ["비교급 + 최상급", "as + 최상급", "the + 최상급", "more + 최상급"], "answer": "3", "explanation": "최상급 앞에는 원칙적으로 정관사 the를 붙여 「the + 최상급」으로 씁니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "최상급 뒤에서 장소나 단체 등 '단수 명사'가 올 때 쓰는 전치사와, 구성원/복수명사가 올 때 쓰는 전치사는?", "options": ["in / of", "at / for", "of / in", "to / with"], "answer": "1", "explanation": "장소, 범위, 집단을 나타내는 단수명사 앞에는 in을, 비교 대상인 복수명사 앞에는 of를 씁니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "형용사 good과 부사 well의 비교급과 최상급 변화로 올바른 것은?", "options": ["gooder - goodest", "better - best", "more good - most good", "better - betterest"], "answer": "2", "explanation": "good/well의 불규칙 변화형은 better - best입니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "형용사 bad, ill의 비교급과 최상급 형태로 올바른 것은?", "options": ["badder - baddest", "worse - worst", "more bad - most bad", "worser - worst"], "answer": "2", "explanation": "bad/ill의 비교급은 worse, 최상급은 worst입니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "many와 much의 비교급·최상급 형태로 올바른 것은?", "options": ["manyer - manyest", "more - most", "mucher - muchest", "more - most"], "answer": "2", "explanation": "many와 much의 비교급은 more, 최상급은 most입니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "양이 적음을 나타내는 little의 비교급과 최상급 형태로 올바른 것은?", "options": ["littler - littlest", "less - least", "few - fewest", "lesser - least"], "answer": "2", "explanation": "little의 비교급은 less, 최상급은 least입니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "'B보다 몇 배 더 ~한'을 나타내는 배수사 비교 표현의 올바른 공식은?", "options": ["배수사 + as + 원급 + as", "배수사 + more + 원급", "as + 배수사 + 원급", "배수사 + the + 최상급"], "answer": "1", "explanation": "배수 표현은 「배수사 + as + 원급 + as」 또는 「배수사 + 비교급 + than」으로 나타냅니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "「as + 원급 + as possible」 구문을 절로 전환할 때 올바른 형태는?", "options": ["as + 원급 + as + 주어 + can/could", "as + 원급 + as + 주어 + must", "as + 원급 + as + 주어 + should", "as + 원급 + as + 주어 + will"], "answer": "1", "explanation": "as~as possible(가능한 한 ~하게)은 「as + 원급 + as + 주어 + can/could」로 전환됩니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "'비교급 + and + 비교급' 구문이 나타내는 올바른 한국어 의미는?", "options": ["가장 ~한 것 중 하나", "점점 더 ~한 [하게]", "~하면 할수록 더 ~하다", "전혀 하지 않은"], "answer": "2", "explanation": "「비교급 + and + 비교급」은 '점점 더 ~한(하게)'이라는 점진적 증가를 나타냅니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "「The + 비교급 ~, the + 비교급 ~」 구문의 올바른 의미는?", "options": ["~할수록 더욱 더하다", "가장 ~해서 ~할 수 없다", "~만큼 ~한 것은 없다", "~하지 않기 위해 하다"], "answer": "1", "explanation": "「The + 비교급, the + 비교급」 구문은 '~하면 할수록 더욱 ~하다'라는 비례 관계를 나타냅니다."}, {"level": "GRADE 2", "chapter": 9, "type": "객관식", "question": "「one of the + 최상급 + 복수명사」 구문 뒤에 오는 명사의 형태는?", "options": ["단수명사", "복수명사", "동명사", "고유명사"], "answer": "2", "explanation": "여러 개 중에서 하나를 고르는 것이므로 최상급 뒤에         const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwUPLVW0Z9yszb6pVPO5RsP6B4FmFeRU_gX_YVM1U1QZy5zWmEO9myTJBZECi64pE8ApQ/exec";

        function saveStates() {

        }

        // LOGIN HANDLER
        async function handleLogin() {
            const inputId = document.getElementById('loginId').value.trim();
            const inputPw = document.getElementById('loginPw').value.trim();

            if (!inputId || !inputPw) {
                alert('아이디와 비밀번호를 입력해주세요.');
                return;
            }

            // Check Admin locally
            if (inputId === adminState.id && inputPw === adminState.pw) {
                currentUser = { role: 'admin', data: adminState };
                showAdminDashboard();
                return;
            }

            // Check Student locally
            const std = studentsState.find(s => s.id === inputId && s.pw === inputPw);
            if (std) {
                currentUser = { role: 'student', data: std };
                showStudentDashboard();
                return;
            }

            // Google Sheets / Apps Script Check
            try {
                const url = `${WEB_APP_URL}?action=login&id=${encodeURIComponent(inputId)}&password=${encodeURIComponent(inputPw)}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.ok && data.user) {
                    const role = String(data.user.role || 'user').trim();

                    if (role === 'admin') {
                        currentUser = { role: 'admin', data: { id: data.user.id, pw: inputPw } };
                        showAdminDashboard();
                    } else {
                        let found = studentsState.find(s => s.id === data.user.id);
                        if (!found) {
                            found = {
                                id: data.user.id,
                                pw: inputPw,
                                name: data.name || data.user.id,
                                grade: data.grade || '초등',
                                gender: data.gender || '남',
                                level: data.level || 'GRADE 1',
                                chapter: data.chapter || 1,
                                targetScore: data.targetScore || 90,
                                lastDate: new Date().toISOString().split('T')[0],
                                wrongHistory: []
                            };
                            studentsState.push(found);
                            saveStates();
                        }
                        currentUser = { role: 'student', data: found };
                        showStudentDashboard();
                    }
                    return;
                }
            } catch (e) {
                console.warn('Apps Script Web App request fallback:', e);
            }

            alert('아이디 또는 비밀번호가 일치하지 않습니다.');
        }

        function updateStudentLevel(id, val) {
            const std = studentsState.find(s => s.id === id);
            if(std) { std.level = val; saveStates(); renderAdminLearningTable(); }
        }
        function updateStudentChapter(id, val) {
            const std = studentsState.find(s => s.id === id);
            if(std) { std.chapter = parseInt(val); saveStates(); renderAdminLearningTable(); }
        }
        function updateStudentTarget(id, val) {
            const std = studentsState.find(s => s.id === id);
            if(std) { std.targetScore = parseInt(val); saveStates(); renderAdminLearningTable(); }
        }

        async function createStudent() {
            const name = document.getElementById('newStdName').value.trim();
            const grade = document.getElementById('newStdGrade').value.trim();
            const gender = document.getElementById('newStdGender').value;
            const id = document.getElementById('newStdId').value.trim();
            const pw = document.getElementById('newStdPw').value.trim();

            if(!name || !id || !pw) { alert('이름, 아이디, 비밀번호를 입력해주세요.'); return; }
            if(studentsState.some(s => s.id === id)) { alert('이미 존재하는 아이디입니다.'); return; }

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify({
                        action: 'createStudent',
                        id: id,
                        password: pw,
                        name: name,
                        grade: grade,
                        gender: gender
                    })
                });

                const result = await res.json();
                if (!result.ok) {
                    alert(result.message || '구글 시트 저장에 실패했습니다.');
                    return;
                }

                studentsState.push({
                    id, pw, name, grade, gender,
                    level: 'GRADE 1', chapter: 1, targetScore: 90,
                    lastDate: new Date().toISOString().split('T')[0], wrongHistory: []
                });
                saveStates();
                alert(result.message || '학생 계정이 생성되었습니다.');
                renderAdminLearningTable();
                renderAdminStudentTable();
            } catch (err) {
                alert('서버 통신 중 오류가 발생했습니다: ' + err.message);
            }
        }

        function deleteStudent(id) {
            if(confirm('정말 삭제하시겠습니까?')) {
                studentsState = studentsState.filter(s => s.id !== id);
                saveStates();
                renderAdminLearningTable();
                renderAdminStudentTable();
            }
        }

            alert(msg);
        }

        function showStudentDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('userInfoBar').style.display = 'flex';
            document.getElementById('welcomeMsg').innerText = `${currentUser.data.name} 학생 (${currentUser.data.level} Ch.${currentUser.data.chapter})`;

            renderStudentConceptView();
        }

        function renderStudentConceptView() {
            document.getElementById('studentConceptView').style.display = 'block';
            document.getElementById('studentQuizView').style.display = 'none';

            const level = currentUser.data.level;
            const chapter = currentUser.data.chapter;

            document.getElementById('conceptLevelBadge').innerText = level;

            const conceptData = (CONCEPTS_DB[level] && CONCEPTS_DB[level][chapter]) ? CONCEPTS_DB[level][chapter] : null;

            if(!conceptData) {
                document.getElementById('conceptTitle').innerText = `Chapter ${chapter} 개념 설명`;
                document.getElementById('conceptContentArea').innerHTML = `<div class="concept-point"><p class="concept-sentence">등록된 개념 설명 데이터가 있습니다. 아래 퀴즈풀기 버튼을 눌러 학습을 완료해보세요.</p></div>`;
                return;
            }

            document.getElementById('conceptTitle').innerText = `Chapter ${chapter}. ${conceptData.title || ''}`;

            const container = document.getElementById('conceptContentArea');
            container.innerHTML = '';

            conceptData.points.forEach((ptText, idx) => {
                const pointBox = document.createElement('div');
                pointBox.className = 'concept-point';

                // Sentence formatting logic: ending with '.' breaks line
                const formattedSentences = ptText.split('.').map(s => s.trim()).filter(s => s.length > 0).map(s => `<span class="concept-sentence">• ${s}.</span>`).join('');

                pointBox.innerHTML = `
                    <span class="concept-point-title">Point 0${idx+1}</span>
                    ${formattedSentences}
                `;
                container.appendChild(pointBox);
            });
        }

        // QUIZ GENERATION & EXECUTION
        function startQuiz() {
            const level = currentUser.data.level;
            const curChapter = currentUser.data.chapter;

            // Gather candidate questions
            const currentChQuestions = QUIZZES_DB.filter(q => q.level === level && q.chapter == curChapter);
            const prevChQuestions = QUIZZES_DB.filter(q => q.level === level && q.chapter < curChapter);

            let selectedQuestions = [];

            if (curChapter === 1 || prevChQuestions.length === 0) {
                // 100% current chapter (20 questions)
                selectedQuestions = shuffleArray([...currentChQuestions]).slice(0, 20);
            } else {
                // 60% current chapter (12 questions), 40% previous chapters (8 questions)
                const currentPicked = shuffleArray([...currentChQuestions]).slice(0, 12);
                const prevPicked = shuffleArray([...prevChQuestions]).slice(0, 8);
                selectedQuestions = shuffleArray([...currentPicked, ...prevPicked]);
            }

            if (selectedQuestions.length === 0) {
                alert('해당 Chapter의 퀴즈 데이터가 부족합니다.');
                return;
            }

            // Format & shuffle options for each question
            currentQuizList = selectedQuestions.map(q => {
                const isOX = (q.type === 'OX' || (q.options[2] === 'N/A' && q.options[3] === 'N/A'));
                let rawOptions = [];
                let correctText = '';

                if (isOX) {
                    rawOptions = ['O', 'X'];
                    correctText = q.answer.trim();
                } else {
                    const ansIdx = parseInt(q.answer) - 1;
                    correctText = q.options[ansIdx];
                    rawOptions = [...q.options];
                }

                let shuffledOpts = isOX ? rawOptions : shuffleArray([...rawOptions]);

                return {
                    original: q,
                    isOX: isOX,
                    questionText: q.question,
                    shuffledOptions: shuffledOpts,
                    correctText: correctText,
                    explanation: q.explanation
                };
            });

            currentQuestionIdx = 0;
            userAnswers = {};

            document.getElementById('studentConceptView').style.display = 'none';
            document.getElementById('studentQuizView').style.display = 'block';

            renderQuestion();
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderQuestion() {
            const q = currentQuizList[currentQuestionIdx];
            const total = currentQuizList.length;

            document.getElementById('quizChapterBadge').innerText = `${currentUser.data.level} Chapter ${currentUser.data.chapter} 퀴즈`;
            document.getElementById('quizStepIndicator').innerText = `문제 ${currentQuestionIdx + 1} / ${total}`;
            document.getElementById('quizProgressFill').style.width = `${((currentQuestionIdx + 1) / total) * 100}%`;
            document.getElementById('quizQuestionText').innerText = `[${q.original.type}] ${q.questionText}`;

            const optsContainer = document.getElementById('quizOptionsContainer');
            optsContainer.innerHTML = '';

            q.shuffledOptions.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (userAnswers[currentQuestionIdx] === idx) {
                    btn.classList.add('selected');
                }
                btn.innerHTML = `<strong>${idx + 1}.</strong> ${optText}`;
                btn.onclick = () => selectOption(idx);
                optsContainer.appendChild(btn);
            });

            document.getElementById('btnQuizPrev').style.visibility = (currentQuestionIdx === 0) ? 'hidden' : 'visible';
            document.getElementById('btnQuizNext').innerText = (currentQuestionIdx === total - 1) ? '퀴즈 제출하기' : '다음 문제';
        }

        function selectOption(idx) {
            userAnswers[currentQuestionIdx] = idx;
            renderQuestion();
        }

        function prevQuestion() {
            if (currentQuestionIdx > 0) {
                currentQuestionIdx--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (userAnswers[currentQuestionIdx] === undefined) {
                alert('정답 보기를 선택해주세요.');
                return;
            }

            if (currentQuestionIdx < currentQuizList.length - 1) {
                currentQuestionIdx++;
                renderQuestion();
            } else {
                submitQuiz();
            }
        }

        function submitQuiz() {
            let correctCount = 0;
            const wrongItems = [];

            currentQuizList.forEach((q, i) => {
                const userChoiceIdx = userAnswers[i];
                const userChoiceText = q.shuffledOptions[userChoiceIdx];

                if (userChoiceText === q.correctText) {
                    correctCount++;
                } else {
                    wrongItems.push({
                        question: q.questionText,
                        userChoice: userChoiceText,
                        correctChoice: q.correctText,
                        explanation: q.explanation
                    });
                }
            });

            const score = Math.round((correctCount / currentQuizList.length) * 100);
            const targetScore = currentUser.data.targetScore || 90;
            const isPassed = score >= targetScore;

            // Save to Student State
            const std = studentsState.find(s => s.id === currentUser.data.id);
            if (std) {
                std.wrongHistory = wrongItems;
                std.lastDate = new Date().toISOString().split('T')[0];
                if (isPassed && std.chapter < 12) {
                    std.chapter += 1;
                }
                saveStates();
            }

            // Render Results Modal
            document.getElementById('modalResultTitle').innerText = isPassed ? "🎉 목표 점수 달성 축하합니다!" : "💪 오답을 확인하고 다시 도전해보세요!";
            document.getElementById('modalResultScore').innerHTML = `최종 점수: <span style="color:var(--primary); font-size:1.5rem;">${score}점</span> / 목표 점수: ${targetScore}점 (${isPassed ? '통과' : '재도전 필요'})`;

            const wrongContainer = document.getElementById('wrongAnswersList');
            wrongContainer.innerHTML = '';

            if (wrongItems.length === 0) {
                wrongContainer.innerHTML = '<p style="color:var(--success); font-weight:700;">모든 문제를 맞히셨습니다! 완벽합니다!</p>';
            } else {
                wrongItems.forEach((w, idx) => {
                    const item = document.createElement('div');
                    item.className = 'wrong-item';
                    item.innerHTML = `
                        <div class="wrong-item-q">Q${idx+1}. ${w.question}</div>
                        <div class="wrong-item-ans">❌ 학생 선택: <span style="color:#DC2626; font-weight:700;">${w.userChoice}</span> | ⭕ 정답: <span style="color:var(--success); font-weight:700;">${w.correctChoice}</span></div>
                        <div class="wrong-item-exp"><strong>💡 상세 해설:</strong> ${w.explanation}</div>
                    `;
                    wrongContainer.appendChild(item);
                });
            }

            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeResultModal() {
            document.getElementById('resultModal').style.display = 'none';
            showStudentDashboard();
        }
    </script>
</body>
</html>
